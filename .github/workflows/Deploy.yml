name: Deploy SkillPoint to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: skillpoint-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static GitHub Pages site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Locate SkillPoint project root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$GITHUB_WORKSPACE/scripts/build-pages.mjs" ]; then
            project_root="$GITHUB_WORKSPACE"
          elif [ -f "$GITHUB_WORKSPACE/skillpoint-master/scripts/build-pages.mjs" ]; then
            project_root="$GITHUB_WORKSPACE/skillpoint-master"
          else
            build_script="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -path '*/scripts/build-pages.mjs' -print -quit)"
            if [ -z "$build_script" ]; then
              echo "Could not find scripts/build-pages.mjs anywhere in the checked-out repository."
              echo "Repository files:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | sort
              exit 1
            fi
            project_root="$(dirname "$(dirname "$build_script")")"
          fi

          echo "PROJECT_ROOT=$project_root" >> "$GITHUB_ENV"
          echo "SkillPoint project root: $project_root"
          test -f "$project_root/scripts/build-pages.mjs"
          test -f "$project_root/scripts/audit.mjs"
          test -f "$project_root/index.html"

      - name: Show runner Node version
        run: node --version

      - name: Build static site without dependency installation or cache
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          node scripts/build-pages.mjs

      - name: Audit generated content and paper inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          node scripts/audit.mjs

      - name: Verify and stage deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/site-pages/index.html"
          test -f "$PROJECT_ROOT/site-pages/assets/styles.css"
          test -f "$PROJECT_ROOT/site-pages/assets/data.js"
          test -f "$PROJECT_ROOT/site-pages/assets/content.js"
          test -f "$PROJECT_ROOT/site-pages/assets/papers.js"
          test -f "$PROJECT_ROOT/site-pages/assets/app.js"
          test -f "$PROJECT_ROOT/site-pages/build-info.json"

          rm -rf "$GITHUB_WORKSPACE/pages-artifact"
          cp -R "$PROJECT_ROOT/site-pages" "$GITHUB_WORKSPACE/pages-artifact"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-artifact

  deploy:
    name: Deploy GitHub Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
