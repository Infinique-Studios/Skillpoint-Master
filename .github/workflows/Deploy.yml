name: Deploy SkillPoint to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: skillpoint-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static GitHub Pages site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show runner Node version
        run: node --version

      - name: Build static site without dependency installation or cache
        run: node scripts/build-pages.mjs

      - name: Audit generated content and paper inventory
        run: node scripts/audit.mjs

      - name: Verify deployment artifact
        run: |
          test -f site-pages/index.html
          test -f site-pages/assets/styles.css
          test -f site-pages/assets/data.js
          test -f site-pages/assets/content.js
          test -f site-pages/assets/papers.js
          test -f site-pages/assets/app.js
          test -f site-pages/build-info.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-pages

  deploy:
    name: Deploy GitHub Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
