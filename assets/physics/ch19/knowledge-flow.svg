      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">When bodies at different</tspan><tspan x="67" dy="20">temperatures are in thermal</tspan><tspan x="67" dy="20">contact,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">They are then in thermal</tspan><tspan x="67" dy="20">equilibrium and there is no</tspan><tspan x="67" dy="20">net…</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Temperature is not the</tspan><tspan x="67" dy="20">amount of energy in a body,</tspan><tspan x="67" dy="20">and…</tspan></text><text x="67" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A thermometric property</tspan><tspan x="67" dy="20">changes reproducibly with</tspan><tspan x="67" dy="20">temperature.</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
