<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Thermal physics: energy bookkeeping</title><desc id="d">Internal energy, heating, work and phase changes use a consistent sign convention and heating-curve model.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Thermal physics: energy bookkeeping</text>
<rect x="35" y="72" width="400" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">First law sign convention</text><rect x="465" y="72" width="400" height="400" rx="18" class="panel"/><text x="485" y="103" class="muted">Heating curve</text>
<rect x="145" y="205" width="180" height="120" rx="18" fill="#172820" stroke="#00ff88" stroke-width="3"/><text x="194" y="272" class="label">SYSTEM</text>
<line x1="72" y1="265" x2="140" y2="265" class="main" marker-end="url(#arrow)"/><text x="65" y="240" class="label">q &gt; 0</text>
<line x1="235" y1="395" x2="235" y2="330" class="cyan" marker-end="url(#arrowC)"/><text x="248" y="390" class="label">W &gt; 0</text>
<text x="95" y="155" class="eq">ΔU = q + W</text><text x="75" y="355" class="small">W is work done on the system.</text>
<line x1="500" y1="425" x2="835" y2="425" class="axis"/><line x1="500" y1="425" x2="500" y2="125" class="axis"/>
<path d="M510 398 L595 330 L680 330 L760 205 L835 205" class="main"/><text x="520" y="385" class="small">solid warms</text><text x="605" y="317" class="small">melting</text><text x="700" y="285" class="small">liquid warms</text><text x="775" y="192" class="small">boiling</text>
<text x="690" y="455" class="small">energy supplied</text><text x="471" y="112" class="small">temperature</text>
</svg>