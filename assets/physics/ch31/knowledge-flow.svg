<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Astronomy and Cosmology — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="174.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="174.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">Luminosity, radiant flux</tspan><tspan x="174.75" dy="25">and…</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Luminosity L is total power</tspan><tspan x="67" dy="20">radiated by a star in all</tspan><tspan x="67" dy="20">directions,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Radiant flux intensity F at</tspan><tspan x="67" dy="20">distance d is received power</tspan><tspan x="67" dy="20">per…</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Assuming isotropic emission</tspan><tspan x="67" dy="20">and negligible absorption,</tspan><tspan x="67" dy="20">the…</tspan></text><text x="67" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Doubling distance reduces</tspan><tspan x="67" dy="20">flux to one quarter.</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="458.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="458.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Standard candles</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">A standard candle is an</tspan><tspan x="350.5" dy="20">object whose luminosity is</tspan><tspan x="350.5" dy="20">known…</tspan></text><text x="350.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Measuring its flux gives d =</tspan><tspan x="350.5" dy="20">√[L/(4πF)].</tspan></text><text x="350.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Examples include Cepheid</tspan><tspan x="350.5" dy="20">variable stars, whose</tspan><tspan x="350.5" dy="20">pulsation…</tspan></text><text x="350.5" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">The method requires</tspan><tspan x="350.5" dy="20">identifying the source</tspan><tspan x="350.5" dy="20">class,…</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="741.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="741.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Wien's law and stellar</tspan><tspan x="741.75" dy="25">surface…</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">A star approximates a</tspan><tspan x="634" dy="20">black-body emitter.</tspan></text><text x="634" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Its continuous spectrum has</tspan><tspan x="634" dy="20">a peak wavelength λmax.</tspan></text><text x="634" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Wien's displacement law</tspan><tspan x="634" dy="20">states λmaxT = b, where b ≈</tspan><tspan x="634" dy="20">2.90…</tspan></text><text x="634" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Hotter stars peak at shorter</tspan><tspan x="634" dy="20">wavelengths and appear bluer</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Stefan–Boltzmann law and</tspan><tspan x="1025.25" dy="25">stellar…</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Power emitted per unit</tspan><tspan x="917.5" dy="20">surface area of a black body</tspan><tspan x="917.5" dy="20">is…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">A spherical star has area</tspan><tspan x="917.5" dy="20">4πR², so luminosity L =</tspan><tspan x="917.5" dy="20">4πσR²T⁴.</tspan></text><text x="917.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Once T is found from Wien's</tspan><tspan x="917.5" dy="20">law and L from flux plus</tspan><tspan x="917.5" dy="20">distance,…</tspan></text><text x="917.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">The fourth-power dependence</tspan><tspan x="917.5" dy="20">is strong: a small</tspan><tspan x="917.5" dy="20">temperature…</tspan></text></svg>