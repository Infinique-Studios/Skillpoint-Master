<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Medical imaging pathways</title><desc id="d">Ultrasound uses echoes, CT combines many X-ray projections, and PET detects back-to-back annihilation photons.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Medical imaging pathways</text>
<rect x="35" y="72" width="250" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Ultrasound</text><rect x="310" y="72" width="270" height="400" rx="18" class="panel"/><text x="330" y="103" class="muted">CT</text><rect x="605" y="72" width="260" height="400" rx="18" class="panel"/><text x="625" y="103" class="muted">PET</text>
<rect x="80" y="130" width="80" height="45" rx="8" fill="#00ff88"/><text x="91" y="158" fill="#07110d" font-family="Arial" font-size="14">transducer</text><path d="M120 180 C90 210 150 230 120 260 C90 290 150 310 120 340" class="cyan"/><path d="M120 340 L215 375" class="axis"/><path d="M120 340 C150 315 190 305 235 300" class="amber" marker-end="url(#arrow)"/><text x="55" y="430" class="eq">d = ct/2</text>
<circle cx="445" cy="270" r="75" fill="#1d8a63"/><ellipse cx="445" cy="270" rx="120" ry="145" class="cyan dash"/><g class="main" marker-end="url(#arrow)"><line x1="335" y1="155" x2="520" y2="355"/><line x1="555" y1="170" x2="355" y2="345"/><line x1="325" y1="270" x2="560" y2="270"/></g><text x="345" y="438" class="small">projections → slices → 3D</text>
<circle cx="735" cy="270" r="32" fill="#172820" stroke="#8ba398"/><circle cx="725" cy="270" r="8" class="chargep"/><circle cx="745" cy="270" r="8" class="chargen"/><line x1="715" y1="270" x2="625" y2="270" class="main" marker-end="url(#arrow)"/><line x1="755" y1="270" x2="845" y2="270" class="main" marker-end="url(#arrow)"/><text x="655" y="230" class="small">511 keV</text><text x="780" y="230" class="small">511 keV</text><text x="635" y="430" class="small">coincident, opposite γ rays</text>
</svg>