<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Circular Motion — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Circular Motion</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d8ff" stop-opacity=".18"/><stop offset="1" stop-color="#55d8ff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#55d8ff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#55d8ff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9702 · 16</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Circular Motion — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="174.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="174.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">Start with radians and</tspan><tspan x="174.75" dy="25">angular…</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">One radian is the angle</tspan><tspan x="67" dy="20">subtended at the centre when</tspan><tspan x="67" dy="20">arc…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Therefore θ = s/r.</tspan></text><text x="67" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A full turn is 2π rad, so</tspan><tspan x="67" dy="20">180° = π rad.</tspan></text><text x="67" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Circular-motion formulae</tspan><tspan x="67" dy="20">assume radians.</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="458.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="458.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Why the acceleration</tspan><tspan x="458.25" dy="25">points…</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">At two nearby points the</tspan><tspan x="350.5" dy="20">velocity vectors have equal</tspan><tspan x="350.5" dy="20">magnitude…</tspan></text><text x="350.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Subtracting the vectors</tspan><tspan x="350.5" dy="20">gives Δv towards the centre.</tspan></text><text x="350.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">In the small-angle limit,</tspan><tspan x="350.5" dy="20">Δv/v = Δs/r = vΔt/r, hence a</tspan><tspan x="350.5" dy="20">=…</tspan></text><text x="350.5" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Combining with v = rω gives</tspan><tspan x="350.5" dy="20">a = rω².</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="741.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="741.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Centripetal force is a</tspan><tspan x="741.75" dy="25">role,…</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Draw only real forces,</tspan><tspan x="634" dy="20">choose the inward radial</tspan><tspan x="634" dy="20">direction…</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">On a level bend, friction</tspan><tspan x="634" dy="20">may provide the inward</tspan><tspan x="634" dy="20">resultant.</tspan></text><text x="634" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">For a conical pendulum, T</tspan><tspan x="634" dy="20">cosθ balances mg and T sinθ</tspan><tspan x="634" dy="20">=…</tspan></text><text x="634" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">On a frictionless bank, the</tspan><tspan x="634" dy="20">horizontal component of the</tspan><tspan x="634" dy="20">normal…</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Circular orbits as an</tspan><tspan x="1025.25" dy="25">application</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">An orbit is continuous free</tspan><tspan x="917.5" dy="20">fall.</tspan></text><text x="917.5" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">For a circular orbit,</tspan><tspan x="917.5" dy="20">gravity supplies exactly the</tspan><tspan x="917.5" dy="20">centripetal…</tspan></text><text x="917.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Near Earth one may write</tspan><tspan x="917.5" dy="20">mv²/r = mg and obtain v =</tspan><tspan x="917.5" dy="20">√(rg),…</tspan></text><text x="917.5" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">More generally, mv²/r =</tspan><tspan x="917.5" dy="20">GMm/r² gives v = √(GM/r).</tspan></text></svg>