<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Circular motion: what changes?</title><desc id="d">Velocity is tangent while acceleration and resultant force point to the centre; angular and linear quantities are related.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Circular motion: what changes?</text>
<rect x="35" y="72" width="400" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Velocity vectors</text><rect x="465" y="72" width="400" height="400" rx="18" class="panel"/><text x="485" y="103" class="muted">Angular ↔ linear</text>
<circle cx="235" cy="275" r="126" class="cyan"/><circle cx="346" cy="216" r="12" class="dot"/>
<line x1="346" y1="216" x2="385" y2="289" class="main" marker-end="url(#arrow)"/><text x="388" y="296" class="label">v tangent</text>
<line x1="346" y1="216" x2="250" y2="267" class="red" marker-end="url(#arrowR)"/><text x="275" y="205" class="label">a, F inward</text>
<line x1="235" y1="275" x2="346" y2="216" class="axis"/><text x="295" y="265" class="small">r</text>
<path d="M235 275 L235 157 A118 118 0 0 1 340 218" class="amber"/><text x="265" y="175" class="label">θ</text>
<text x="505" y="143" class="eq">θ = s / r</text><text x="505" y="194" class="eq">ω = Δθ / Δt = 2π / T</text>
<text x="505" y="245" class="eq">v = rω</text><text x="505" y="296" class="eq">a = v²/r = rω²</text>
<text x="505" y="347" class="eq">F = mv²/r = mrω²</text><text x="505" y="410" class="small">“Centripetal” names the inward resultant.</text>
</svg>