<text x="52" y="43" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9702 · 18</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Oscillations — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="174.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="174.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">Language, phase and the</tspan><tspan x="174.75" dy="25">SHM…</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Displacement x is measured</tspan><tspan x="67" dy="20">from equilibrium and carries</tspan><tspan x="67" dy="20">a…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">amplitude x₀ is the maximum</tspan><tspan x="67" dy="20">magnitude of displacement.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">One period T is one complete</tspan><tspan x="67" dy="20">cycle and f = 1/T.</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Angular frequency ω = 2πf =</tspan><tspan x="67" dy="20">2π/T.</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="458.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="458.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Equations and graph</tspan><tspan x="458.25" dy="25">relationships</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">For the syllabus choice x =</tspan><tspan x="350.5" dy="20">x₀ sinωt, differentiation</tspan><tspan x="350.5" dy="20">gives…</tspan></text><text x="350.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Eliminating time gives v =</tspan><tspan x="350.5" dy="20">±ω√(x₀² − x²).</tspan></text><text x="350.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">The ± sign matters because</tspan><tspan x="350.5" dy="20">an oscillator can pass the</tspan><tspan x="350.5" dy="20">same…</tspan></text><text x="350.5" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Read graph gradients</tspan><tspan x="350.5" dy="20">carefully: gradient of x–t</tspan><tspan x="350.5" dy="20">is…</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="741.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="741.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Energy in SHM</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Total mechanical energy in</tspan><tspan x="634" dy="20">ideal SHM is E = ½mω²x₀².</tspan></text><text x="634" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">For a spring, potential</tspan><tspan x="634" dy="20">energy is ½kx² and ω² = k/m,</tspan><tspan x="634" dy="20">so…</tspan></text><text x="634" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Kinetic energy is the</tspan><tspan x="634" dy="20">remainder: Ek = ½mω²(x₀² −</tspan><tspan x="634" dy="20">x²).</tspan></text><text x="634" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">At the extremes all energy</tspan><tspan x="634" dy="20">is potential</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Free, forced and damped</tspan><tspan x="1025.25" dy="25">oscillations</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">A free oscillator is</tspan><tspan x="917.5" dy="20">displaced and left to move</tspan><tspan x="917.5" dy="20">at…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">A forced oscillator receives</tspan><tspan x="917.5" dy="20">a periodic driving force.</tspan></text><text x="917.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">At first a transient may</tspan><tspan x="917.5" dy="20">coexist with the forced</tspan><tspan x="917.5" dy="20">response</tspan></text><text x="917.5" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">after damping removes the</tspan><tspan x="917.5" dy="20">transient, it oscillates at</tspan><tspan x="917.5" dy="20">the…</tspan></text></svg>