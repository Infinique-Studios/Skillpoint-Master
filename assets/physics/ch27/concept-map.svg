<title id="t">AC, rectification and smoothing</title><desc id="d">A sinusoidal input is rectified by a bridge and a capacitor reduces ripple between peaks.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">AC, rectification and smoothing</text>
<rect x="35" y="72" width="250" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Sinusoidal AC</text><rect x="310" y="72" width="270" height="400" rx="18" class="panel"/><text x="330" y="103" class="muted">Full-wave output</text><rect x="605" y="72" width="260" height="400" rx="18" class="panel"/><text x="625" y="103" class="muted">Capacitor smoothing</text>
<line x1="60" y1="270" x2="260" y2="270" class="axis"/><path d="M60 270 C85 150 125 150 150 270 S215 390 260 270" class="main"/><line x1="150" y1="270" x2="150" y2="185" class="amber dash"/><text x="70" y="420" class="eq">Vᵣₘₛ = V₀/√2</text>
<line x1="335" y1="390" x2="555" y2="390" class="axis"/><path d="M335 390 C365 220 405 220 435 390 C465 220 510 220 555 390" class="main"/><text x="350" y="430" class="small">both half-cycles are positive</text>
<line x1="630" y1="390" x2="840" y2="390" class="axis"/><path d="M630 390 C650 220 675 220 690 390 C710 220 735 220 750 390 C770 220 800 220 840 390" class="grid"/><path d="M630 390 C650 225 675 225 690 245 C710 225 735 225 750 245 C770 225 800 225 840 250" class="main"/><text x="640" y="430" class="small">larger RC → less ripple</text>
