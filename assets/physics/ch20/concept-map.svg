<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Kinetic model of an ideal gas</title><desc id="d">Molecular collisions transfer momentum to the walls; the microscopic and macroscopic equations connect through temperature.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Kinetic model of an ideal gas</text>
<rect x="35" y="72" width="430" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Molecules in a box</text><rect x="490" y="72" width="375" height="400" rx="18" class="panel"/><text x="510" y="103" class="muted">Micro ↔ macro</text>
<rect x="85" y="130" width="320" height="250" rx="8" fill="none" stroke="#8ba398" stroke-width="3"/>
<g class="dot"><circle cx="140" cy="180" r="8"/><circle cx="245" cy="155" r="8"/><circle cx="330" cy="205" r="8"/><circle cx="175" cy="310" r="8"/><circle cx="285" cy="340" r="8"/><circle cx="360" cy="285" r="8"/></g>
<g class="main" marker-end="url(#arrow)"><line x1="140" y1="180" x2="205" y2="215"/><line x1="245" y1="155" x2="280" y2="120"/><line x1="330" y1="205" x2="395" y2="180"/><line x1="175" y1="310" x2="120" y2="350"/><line x1="285" y1="340" x2="335" y2="305"/></g>
<line x1="405" y1="225" x2="445" y2="225" class="red" marker-end="url(#arrowR)"/><text x="318" y="415" class="small">pressure = momentum transfer / area / time</text>
<text x="525" y="145" class="eq">pV = NkT = nRT</text><text x="525" y="205" class="eq">pV = ⅓Nm⟨c²⟩</text><text x="525" y="265" class="eq">cᵣₘₛ = √⟨c²⟩</text><text x="525" y="325" class="eq">⟨Eₖ⟩ = ³⁄₂ kT</text>
<text x="525" y="395" class="small">Temperature tracks mean translational KE,</text><text x="525" y="419" class="small">not the speed of one chosen molecule.</text>
</svg>