      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Kinetic-theory</tspan><tspan x="741.75" dy="25">assumptions</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">The model treats a gas as a</tspan><tspan x="634" dy="20">very large number of</tspan><tspan x="634" dy="20">molecules…</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Molecular volume is</tspan><tspan x="634" dy="20">negligible compared with</tspan><tspan x="634" dy="20">container…</tspan></text><text x="634" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">molecules exert no forces on</tspan><tspan x="634" dy="20">one another except during</tspan><tspan x="634" dy="20">collisions</tspan></text><text x="634" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">collisions with each other</tspan><tspan x="634" dy="20">and the walls are perfectly</tspan><tspan x="634" dy="20">elastic</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">How molecular collisions</tspan><tspan x="1025.25" dy="25">produce…</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Consider a molecule of mass</tspan><tspan x="917.5" dy="20">m with x-component of</tspan><tspan x="917.5" dy="20">velocity…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">At a perpendicular wall its</tspan><tspan x="917.5" dy="20">momentum changes from +mcx</tspan><tspan x="917.5" dy="20">to…</tspan></text><text x="917.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">It hits the same wall every</tspan><tspan x="917.5" dy="20">2L/cx, giving average force</tspan><tspan x="917.5" dy="20">mcx²/L.</tspan></text><text x="917.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Summing over N molecules and</tspan><tspan x="917.5" dy="20">dividing by wall area A</tspan><tspan x="917.5" dy="20">gives…</tspan></text></svg>