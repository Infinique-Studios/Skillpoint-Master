      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">Magnetic field and field</tspan><tspan x="174.75" dy="25">lines</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A magnetic field is a region</tspan><tspan x="67" dy="20">in which a moving charge,</tspan><tspan x="67" dy="20">current-carrying…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Outside a bar magnet, field</tspan><tspan x="67" dy="20">lines run from north to</tspan><tspan x="67" dy="20">south</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">inside they complete closed</tspan><tspan x="67" dy="20">loops from south to north.</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A tangent gives field</tspan><tspan x="67" dy="20">direction and closer spacing</tspan><tspan x="67" dy="20">indicates…</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
