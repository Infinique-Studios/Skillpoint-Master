      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Why parallel currents</tspan><tspan x="1025.25" dy="25">attract…</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Each wire produces a</tspan><tspan x="917.5" dy="20">circular magnetic field at</tspan><tspan x="917.5" dy="20">the…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">The second wire's current</tspan><tspan x="917.5" dy="20">then experiences F = BIL in</tspan><tspan x="917.5" dy="20">that…</tspan></text><text x="917.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Applying the direction rule</tspan><tspan x="917.5" dy="20">twice shows currents in the</tspan><tspan x="917.5" dy="20">same…</tspan></text><text x="917.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">The forces are equal and</tspan><tspan x="917.5" dy="20">opposite.</tspan></text></svg>