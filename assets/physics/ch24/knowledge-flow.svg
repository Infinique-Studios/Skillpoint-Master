      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Fields made by currents</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Around a long straight wire,</tspan><tspan x="634" dy="20">field lines are concentric</tspan><tspan x="634" dy="20">circles.</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">The right-hand grip rule</tspan><tspan x="634" dy="20">gives direction: thumb along</tspan><tspan x="634" dy="20">conventional…</tspan></text><text x="634" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Field is stronger closer to</tspan><tspan x="634" dy="20">the wire and for larger</tspan><tspan x="634" dy="20">current.</tspan></text><text x="634" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">A flat circular coil</tspan><tspan x="634" dy="20">produces a bar-magnet-like</tspan><tspan x="634" dy="20">field…</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
