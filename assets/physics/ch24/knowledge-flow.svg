      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Force on a</tspan><tspan x="458.25" dy="25">current-carrying…</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">A wire of active length L</tspan><tspan x="350.5" dy="20">carrying conventional</tspan><tspan x="350.5" dy="20">current…</tspan></text><text x="350.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Force is maximum at 90° and</tspan><tspan x="350.5" dy="20">zero when current is</tspan><tspan x="350.5" dy="20">parallel…</tspan></text><text x="350.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Fleming's left hand gives:</tspan><tspan x="350.5" dy="20">first finger field, second</tspan><tspan x="350.5" dy="20">finger…</tspan></text><text x="350.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">At right angles, magnetic</tspan><tspan x="350.5" dy="20">flux density is defined as</tspan><tspan x="350.5" dy="20">force…</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
