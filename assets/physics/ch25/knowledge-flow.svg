<text x="52" y="43" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9702 · 25</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Motion of Charged Particles — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="174.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="174.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">Electric force versus</tspan><tspan x="174.75" dy="25">magnetic…</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">An electric field gives F =</tspan><tspan x="67" dy="20">qE whether or not a charge</tspan><tspan x="67" dy="20">is…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Because force can have a</tspan><tspan x="67" dy="20">component along</tspan><tspan x="67" dy="20">displacement,…</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A magnetic field gives F =</tspan><tspan x="67" dy="20">Bqv sinθ only to a moving</tspan><tspan x="67" dy="20">charge</tspan></text><text x="67" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">the force is perpendicular</tspan><tspan x="67" dy="20">to both v and B.</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="458.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="458.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Circular motion in a</tspan><tspan x="458.25" dy="25">magnetic…</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">For v perpendicular to a</tspan><tspan x="350.5" dy="20">uniform B, magnetic force is</tspan><tspan x="350.5" dy="20">always…</tspan></text><text x="350.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Hence r = mv/(B|q|).</tspan></text><text x="350.5" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Greater momentum gives a</tspan><tspan x="350.5" dy="20">larger radius</tspan></text><text x="350.5" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">greater charge magnitude or</tspan><tspan x="350.5" dy="20">B gives tighter curvature.</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="741.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="741.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Velocity selection with</tspan><tspan x="741.75" dy="25">crossed…</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">In a velocity selector,</tspan><tspan x="634" dy="20">uniform electric and</tspan><tspan x="634" dy="20">magnetic…</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Plate polarity and B</tspan><tspan x="634" dy="20">direction are chosen so</tspan><tspan x="634" dy="20">electric…</tspan></text><text x="634" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">An undeflected particle</tspan><tspan x="634" dy="20">satisfies qE = Bqv, so v =</tspan><tspan x="634" dy="20">E/B.</tspan></text><text x="634" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">If v is too large, magnetic</tspan><tspan x="634" dy="20">force dominates</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Hall effect and Hall</tspan><tspan x="1025.25" dy="25">voltage</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">A current-carrying strip in</tspan><tspan x="917.5" dy="20">a perpendicular magnetic</tspan><tspan x="917.5" dy="20">field…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Magnetic force pushes</tspan><tspan x="917.5" dy="20">carriers sideways, building</tspan><tspan x="917.5" dy="20">charge…</tspan></text><text x="917.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">At equilibrium qEH = Bqv, so</tspan><tspan x="917.5" dy="20">EH = Bv and Hall voltage VH</tspan><tspan x="917.5" dy="20">=…</tspan></text><text x="917.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">For carrier number density</tspan><tspan x="917.5" dy="20">n, strip cross-sectional</tspan><tspan x="917.5" dy="20">area…</tspan></text></svg>