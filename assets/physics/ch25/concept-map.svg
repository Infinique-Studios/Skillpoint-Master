<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Charged particles in fields</title><desc id="d">Electric fields change speed; perpendicular magnetic fields bend paths; crossed fields select one speed.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Charged particles in fields</text>
<rect x="35" y="72" width="400" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Magnetic circular path</text><rect x="465" y="72" width="400" height="400" rx="18" class="panel"/><text x="485" y="103" class="muted">Velocity selector</text>
<circle cx="225" cy="270" r="115" class="cyan dash"/><circle cx="320" cy="205" r="11" class="chargep"/><line x1="320" y1="205" x2="360" y2="260" class="main" marker-end="url(#arrow)"/><line x1="320" y1="205" x2="250" y2="250" class="red" marker-end="url(#arrowR)"/><text x="330" y="193" class="small">v</text><text x="252" y="220" class="small">BQv</text><text x="75" y="430" class="eq">r = mv/(BQ),  T = 2πm/(BQ)</text>
<rect x="510" y="125" width="310" height="18" class="chargep"/><rect x="510" y="405" width="310" height="18" class="chargen"/><g fill="#55d8ff"><text x="520" y="210" class="label">× × × × × ×</text><text x="520" y="270" class="label">× × × × × ×</text><text x="520" y="330" class="label">× × × × × ×</text></g><line x1="490" y1="275" x2="800" y2="275" class="main" marker-end="url(#arrow)"/><line x1="650" y1="275" x2="650" y2="205" class="red" marker-end="url(#arrowR)"/><line x1="670" y1="275" x2="670" y2="345" class="cyan" marker-end="url(#arrowC)"/><text x="600" y="185" class="small">electric qE</text><text x="685" y="350" class="small">magnetic Bqv</text><text x="560" y="455" class="eq">selected v = E/B</text>
</svg>