      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">Charge, force and field</tspan><tspan x="174.75" dy="25">direction</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Electric field strength E at</tspan><tspan x="67" dy="20">a point is force per unit</tspan><tspan x="67" dy="20">positive…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Field direction is the force</tspan><tspan x="67" dy="20">direction on a positive</tspan><tspan x="67" dy="20">charge.</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A negative charge feels</tspan><tspan x="67" dy="20">force opposite to E.</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Electric field lines begin</tspan><tspan x="67" dy="20">on positive charge and end</tspan><tspan x="67" dy="20">on…</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
