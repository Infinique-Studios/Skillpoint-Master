      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Motion from rest along</tspan><tspan x="741.75" dy="25">the…</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">A charge q experiences F =</tspan><tspan x="634" dy="20">qE and acceleration a =</tspan><tspan x="634" dy="20">qE/m,…</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">A positive particle</tspan><tspan x="634" dy="20">accelerates towards lower</tspan><tspan x="634" dy="20">electric…</tspan></text><text x="634" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">a negative particle</tspan><tspan x="634" dy="20">accelerates towards higher</tspan><tspan x="634" dy="20">potential.</tspan></text><text x="634" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">If other forces are</tspan><tspan x="634" dy="20">negligible, the acceleration</tspan><tspan x="634" dy="20">is…</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Sideways entry: a</tspan><tspan x="1025.25" dy="25">parabolic…</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Suppose a particle enters</tspan><tspan x="917.5" dy="20">horizontally with speed u</tspan><tspan x="917.5" dy="20">between…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">There is no horizontal</tspan><tspan x="917.5" dy="20">electric force, so x = ut.</tspan></text><text x="917.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Vertically, ay = qE/m is</tspan><tspan x="917.5" dy="20">constant, so y = ½(qE/m)t²</tspan><tspan x="917.5" dy="20">if…</tspan></text><text x="917.5" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Eliminating t gives y =</tspan><tspan x="917.5" dy="20">qEx²/(2mu²), a parabola.</tspan></text></svg>