      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Parallel plates and</tspan><tspan x="458.25" dy="25">potential…</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">For plates separated by</tspan><tspan x="350.5" dy="20">perpendicular distance d</tspan><tspan x="350.5" dy="20">with…</tspan></text><text x="350.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Potential decreases in the</tspan><tspan x="350.5" dy="20">direction of E, so the more</tspan><tspan x="350.5" dy="20">general…</tspan></text><text x="350.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">The simple equation assumes</tspan><tspan x="350.5" dy="20">a uniform region and</tspan><tspan x="350.5" dy="20">neglects…</tspan></text><text x="350.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Increasing plate p.d.</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
