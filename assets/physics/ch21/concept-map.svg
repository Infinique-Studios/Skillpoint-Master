<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Uniform electric field and particle path</title><desc id="d">Parallel plates produce a uniform field; a charged particle has constant transverse acceleration and a parabolic path.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Uniform electric field and particle path</text>
<rect x="35" y="72" width="400" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Parallel plates</text><rect x="465" y="72" width="400" height="400" rx="18" class="panel"/><text x="485" y="103" class="muted">Electron beam</text>
<rect x="80" y="140" width="310" height="22" rx="5" class="chargep"/><rect x="80" y="382" width="310" height="22" rx="5" class="chargen"/>
<g class="main" marker-end="url(#arrow)"><line x1="120" y1="180" x2="120" y2="360"/><line x1="180" y1="180" x2="180" y2="360"/><line x1="240" y1="180" x2="240" y2="360"/><line x1="300" y1="180" x2="300" y2="360"/><line x1="360" y1="180" x2="360" y2="360"/></g>
<text x="90" y="130" class="label">+ + + + + + +</text><text x="90" y="435" class="label">− − − − − − −</text><text x="130" y="255" class="eq">E = ΔV/d</text><text x="130" y="290" class="eq">F = qE</text>
<rect x="510" y="145" width="310" height="18" rx="4" class="chargep"/><rect x="510" y="382" width="310" height="18" rx="4" class="chargen"/>
<path d="M490 265 Q650 265 805 350" class="cyan"/><circle cx="500" cy="265" r="9" class="chargen"/><line x1="500" y1="265" x2="575" y2="265" class="main" marker-end="url(#arrow)"/><text x="515" y="245" class="small">initial v</text>
<line x1="650" y1="265" x2="650" y2="325" class="red" marker-end="url(#arrowR)"/><text x="663" y="298" class="small">force on e⁻</text><text x="515" y="435" class="small">x = vt, y = ½(qE/m)t² → parabola</text>
</svg>