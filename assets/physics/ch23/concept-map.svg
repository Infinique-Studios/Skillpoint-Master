<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Capacitor energy and RC discharge</title><desc id="d">The area under a V–Q graph is stored energy; charge, voltage and current decay with time constant RC.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Capacitor energy and RC discharge</text>
<rect x="35" y="72" width="400" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Energy stored</text><rect x="465" y="72" width="400" height="400" rx="18" class="panel"/><text x="485" y="103" class="muted">Exponential discharge</text>
<line x1="80" y1="400" x2="390" y2="400" class="axis"/><line x1="80" y1="400" x2="80" y2="125" class="axis"/><path d="M80 400 L360 145" class="main"/><path d="M80 400 L360 145 L360 400 Z" fill="#00ff8833"/>
<text x="185" y="330" class="label">area = ½QV</text><text x="320" y="430" class="small">Q</text><text x="55" y="130" class="small">V</text><text x="105" y="448" class="eq">W = ½QV = ½CV² = Q²/(2C)</text>
<line x1="505" y1="400" x2="835" y2="400" class="axis"/><line x1="505" y1="400" x2="505" y2="125" class="axis"/><path d="M510 145 C555 245 620 350 825 390" class="main"/><line x1="620" y1="125" x2="620" y2="400" class="amber dash"/><line x1="505" y1="306" x2="620" y2="306" class="grid dash"/>
<text x="628" y="155" class="label">t = RC</text><text x="515" y="298" class="small">x₀/e</text><text x="525" y="448" class="eq">x = x₀e^(−t/RC)</text>
</svg>