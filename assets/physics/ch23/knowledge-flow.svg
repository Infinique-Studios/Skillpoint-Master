</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#55d8ff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9702 · 23</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Capacitance — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="174.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="174.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="174.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="174.75" dy="0">What a capacitor stores</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A capacitor consists of two</tspan><tspan x="67" dy="20">conductors separated by an</tspan><tspan x="67" dy="20">insulator…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">A source transfers electrons</tspan><tspan x="67" dy="20">from one plate to the other,</tspan><tspan x="67" dy="20">leaving…</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">The capacitor's net charge</tspan><tspan x="67" dy="20">is zero, but 'charge stored'</tspan><tspan x="67" dy="20">means…</tspan></text><text x="67" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="67" dy="0">Capacitance C = Q/V is the</tspan><tspan x="67" dy="20">charge stored per unit p.d.</tspan></text><path d="M307.5 374H321.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="328.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="458.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="458.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="458.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="458.25" dy="0">Capacitors in parallel</tspan><tspan x="458.25" dy="25">and…</tspan></text>
      <text x="350.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Parallel capacitors share</tspan><tspan x="350.5" dy="20">the same p.d.</tspan></text><text x="350.5" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Their charges add: Q = ΣCᵢV,</tspan><tspan x="350.5" dy="20">so Ceq = ΣCᵢ.</tspan></text><text x="350.5" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Equivalent capacitance is</tspan><tspan x="350.5" dy="20">therefore larger than any</tspan><tspan x="350.5" dy="20">individual…</tspan></text><text x="350.5" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="350.5" dy="0">Series capacitors carry the</tspan><tspan x="350.5" dy="20">same magnitude charge Q</tspan><tspan x="350.5" dy="20">because…</tspan></text><path d="M591 374H605" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="612" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="741.75" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="741.75" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Energy stored in the</tspan><tspan x="741.75" dy="25">electric…</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">As a capacitor charges, the</tspan><tspan x="634" dy="20">next small charge dQ is</tspan><tspan x="634" dy="20">moved…</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">The work is the area under</tspan><tspan x="634" dy="20">the V–Q graph from 0 to Q.</tspan></text><text x="634" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">For a linear capacitor this</tspan><tspan x="634" dy="20">is a triangle, so W = ½QV.</tspan></text><text x="634" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Substituting Q = CV gives W</tspan><tspan x="634" dy="20">= ½CV²</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="1025.25" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">4</text>
      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Discharge through a</tspan><tspan x="1025.25" dy="25">resistor</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">For a capacitor discharging</tspan><tspan x="917.5" dy="20">through R, V = Q/C and</tspan><tspan x="917.5" dy="20">current…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Kirchhoff's law gives Q/C +</tspan><tspan x="917.5" dy="20">IR = 0 with a signed</tspan><tspan x="917.5" dy="20">current,…</tspan></text><text x="917.5" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Because V ∝ Q and I ∝ Q,</tspan><tspan x="917.5" dy="20">their magnitudes follow the</tspan><tspan x="917.5" dy="20">same…</tspan></text><text x="917.5" y="522" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">The time constant τ = RC is</tspan><tspan x="917.5" dy="20">the time for Q, V or current</tspan><tspan x="917.5" dy="20">magnitude…</tspan></text></svg>