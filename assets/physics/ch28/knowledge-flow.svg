      <text x="741.75" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="741.75" dy="0">Frequency and intensity</tspan><tspan x="741.75" dy="25">observations</tspan></text>
      <text x="634" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Increasing frequency at</tspan><tspan x="634" dy="20">fixed intensity raises</tspan><tspan x="634" dy="20">energy…</tspan></text><text x="634" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">Increasing intensity at</tspan><tspan x="634" dy="20">fixed frequency raises</tspan><tspan x="634" dy="20">photons…</tspan></text><text x="634" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">A stopping potential Vs is</tspan><tspan x="634" dy="20">the reverse p.d.</tspan></text><text x="634" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="634" dy="0">just sufficient to stop even</tspan><tspan x="634" dy="20">the fastest photoelectrons,</tspan><tspan x="634" dy="20">so…</tspan></text><path d="M874.5 374H888.5" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="895.5" y="138" width="259.5" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="1025.25" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
