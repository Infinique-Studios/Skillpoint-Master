      <text x="1025.25" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700"><tspan x="1025.25" dy="0">Wave–particle duality</tspan><tspan x="1025.25" dy="25">and…</tspan></text>
      <text x="917.5" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Interference and diffraction</tspan><tspan x="917.5" dy="20">show the wave nature of</tspan><tspan x="917.5" dy="20">electromagnetic…</tspan></text><text x="917.5" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">Neither classical picture</tspan><tspan x="917.5" dy="20">alone is complete</tspan></text><text x="917.5" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">the behaviour observed</tspan><tspan x="917.5" dy="20">depends on the experiment.</tspan></text><text x="917.5" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="14"><tspan x="917.5" dy="0">de Broglie proposed</tspan><tspan x="917.5" dy="20">wavelength λ = h/p for a</tspan><tspan x="917.5" dy="20">moving…</tspan></text></svg>