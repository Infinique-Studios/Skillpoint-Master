<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Quantum evidence and energy</title><desc id="d">One photon transfers energy to one electron; matter also has a wavelength, and atoms have discrete levels.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Quantum evidence and energy</text>
<rect x="35" y="72" width="250" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Photoelectric effect</text><rect x="310" y="72" width="270" height="400" rx="18" class="panel"/><text x="330" y="103" class="muted">Kmax against f</text><rect x="605" y="72" width="260" height="400" rx="18" class="panel"/><text x="625" y="103" class="muted">Atomic levels</text>
<rect x="85" y="310" width="150" height="28" fill="#8ba398"/><g class="amber" marker-end="url(#arrow)"><line x1="65" y1="140" x2="120" y2="292"/><line x1="105" y1="130" x2="145" y2="292"/><line x1="145" y1="130" x2="170" y2="292"/></g><circle cx="170" cy="295" r="8" class="chargen"/><path d="M170 295 Q205 250 245 245" class="cyan" marker-end="url(#arrowC)"/><text x="65" y="385" class="eq">hf = Φ + Kmax</text>
<line x1="345" y1="400" x2="550" y2="400" class="axis"/><line x1="345" y1="400" x2="345" y2="135" class="axis"/><path d="M390 400 L535 165" class="main"/><text x="372" y="430" class="small">f₀</text><text x="420" y="190" class="small">gradient h</text><text x="340" y="455" class="eq">λ = h/p</text>
<g class="axis"><line x1="640" y1="395" x2="835" y2="395"/><line x1="670" y1="320" x2="810" y2="320"/><line x1="700" y1="245" x2="785" y2="245"/><line x1="720" y1="165" x2="765" y2="165"/></g><line x1="742" y1="170" x2="742" y2="312" class="main" marker-end="url(#arrow)"/><text x="660" y="445" class="eq">hf = Ehigh − Elow</text>
