        <text x="673" y="276" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">g = F/m = GM/r²</tspan></text>
        <text x="673" y="301" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Field strength of a point/spherical mass — Outside a</tspan><tspan x="673" dy="18">uniform…</tspan></text><circle cx="655" cy="360" r="5" fill="#ffc857" fill-opacity="0.76"/>
        <text x="673" y="365" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">φ = −GM/r</tspan></text>
