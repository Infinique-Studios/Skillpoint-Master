        <text x="673" y="436" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">Ep = mφ = −GMm/r</tspan></text>
        <text x="673" y="461" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Potential energy of two point masses — Zero at</tspan><tspan x="673" dy="18">infinite…</tspan></text>
