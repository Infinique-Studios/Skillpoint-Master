<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Gravity: field, potential and orbit</title><desc id="d">A radial inverse-square field has negative potential; gravity can supply the centripetal force for an orbit.</desc><defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#00ff88"/></marker>
<marker id="arrowC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#55d8ff"/></marker>
<marker id="arrowR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ff6b6b"/></marker>
<style>
  .bg{fill:#0d1512}.panel{fill:#111d18;stroke:#29483a;stroke-width:1.5}.grid{stroke:#20352d;stroke-width:1}
  .axis{stroke:#8ba398;stroke-width:2}.main{stroke:#00ff88;stroke-width:4;fill:none}.cyan{stroke:#55d8ff;stroke-width:3;fill:none}
  .amber{stroke:#ffc857;stroke-width:3;fill:none}.red{stroke:#ff6b6b;stroke-width:3;fill:none}.dash{stroke-dasharray:8 7}
  .muted{fill:#8ba398;font:16px Inter,Arial,sans-serif}.label{fill:#f1f7f4;font:17px Inter,Arial,sans-serif}
  .small{fill:#a7bbb2;font:14px Inter,Arial,sans-serif}.title{fill:#fff;font:bold 24px Inter,Arial,sans-serif}
  .eq{fill:#00ff88;font:bold 19px 'Courier New',monospace}.dot{fill:#00ff88}.chargep{fill:#ff6b6b}.chargen{fill:#55d8ff}
</style></defs><rect width="900" height="520" rx="28" class="bg"/>
<text x="42" y="48" class="title">Gravity: field, potential and orbit</text>
<rect x="35" y="72" width="250" height="400" rx="18" class="panel"/><text x="55" y="103" class="muted">Field lines</text><rect x="310" y="72" width="270" height="400" rx="18" class="panel"/><text x="330" y="103" class="muted">Potential</text><rect x="605" y="72" width="260" height="400" rx="18" class="panel"/><text x="625" y="103" class="muted">Circular orbit</text>
<circle cx="160" cy="270" r="43" fill="#1d8a63"/><g class="main" marker-end="url(#arrow)">
<line x1="160" y1="130" x2="160" y2="210"/><line x1="160" y1="410" x2="160" y2="330"/><line x1="45" y1="200" x2="115" y2="244"/><line x1="275" y1="200" x2="205" y2="244"/><line x1="45" y1="340" x2="115" y2="296"/><line x1="275" y1="340" x2="205" y2="296"/></g>
<text x="65" y="445" class="eq">g = GM/r²</text>
<line x1="350" y1="400" x2="555" y2="400" class="axis"/><line x1="350" y1="400" x2="350" y2="120" class="axis"/>
<path d="M370 145 C395 250 445 335 550 375" class="main"/><line x1="350" y1="270" x2="555" y2="270" class="grid dash"/><text x="365" y="438" class="eq">φ = −GM/r</text><text x="323" y="116" class="small">0</text><text x="313" y="400" class="small">negative</text>
<circle cx="735" cy="272" r="58" fill="#1d8a63"/><ellipse cx="735" cy="272" rx="112" ry="150" class="cyan dash"/><circle cx="818" cy="170" r="11" class="dot"/>
<line x1="818" y1="170" x2="760" y2="242" class="red" marker-end="url(#arrowR)"/><line x1="818" y1="170" x2="855" y2="200" class="main" marker-end="url(#arrow)"/>
<text x="625" y="445" class="eq">v = √(GM/r)</text>
</svg>