      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Diversity may increase autonomy</tspan><tspan x="823" dy="20">yet insecurity/lone-parent</tspan><tspan x="823" dy="20">poverty/care…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">New Right concerns vs</tspan><tspan x="823" dy="20">postmodern/feminist</tspan><tspan x="823" dy="20">interpretations.</tspan></text></svg>