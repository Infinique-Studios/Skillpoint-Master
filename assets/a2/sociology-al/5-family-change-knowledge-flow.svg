      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Fertility and parenting</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Contraception, women’s</tspan><tspan x="445" dy="20">education/work, child cost,</tspan><tspan x="445" dy="20">mortality…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Parenting norms and assisted</tspan><tspan x="445" dy="20">reproduction.</tspan></text><path d="M780 374H794" stroke="#ff9fcb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
