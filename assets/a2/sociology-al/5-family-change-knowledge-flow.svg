      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Changing marriage age/rates,</tspan><tspan x="67" dy="20">cohabitation, same-sex</tspan><tspan x="67" dy="20">partnership,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Law, secularisation, gender</tspan><tspan x="67" dy="20">equality, expectations and</tspan><tspan x="67" dy="20">individualisation.</tspan></text><path d="M402 374H416" stroke="#ff9fcb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
