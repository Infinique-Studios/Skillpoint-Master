      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Interpret and communicate</tspan></text><circle cx="838" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="856" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Separate observation from</tspan><tspan x="856" dy="21">explanation.</tspan></text><circle cx="838" cy="352" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="856" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Use reproducible steps.</tspan></text><circle cx="838" cy="417" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="856" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Tailor precision/detail to audience.</tspan></text><circle cx="838" cy="482" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="856" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Describe pattern with values, then</tspan><tspan x="856" dy="21">explain…</tspan></text></svg>