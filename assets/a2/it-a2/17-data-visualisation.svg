      <text x="465.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Visualise honestly</tspan></text><circle cx="456" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="474" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Chart type follows question and</tspan><tspan x="474" dy="21">variable…</tspan></text><circle cx="456" cy="352" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="474" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Do not connect unordered categories</tspan><tspan x="474" dy="21">with…</tspan></text><circle cx="456" cy="423" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="474" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Show uncertainty/sample size where</tspan><tspan x="474" dy="21">relevant.</tspan></text><circle cx="456" cy="494" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="474" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Bar charts compare categories</tspan></text><path d="M778 372H802" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
