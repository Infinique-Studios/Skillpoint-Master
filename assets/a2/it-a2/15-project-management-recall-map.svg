        <text x="93" y="319" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Time a task may slip without delaying project/end</tspan><tspan x="93" dy="18">milestone.</tspan></text><circle cx="75" cy="378" r="5" fill="#55d8ff" fill-opacity="0.76"/>
