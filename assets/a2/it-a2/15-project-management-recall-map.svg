        <text x="93" y="230" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Longest-duration dependency path determining minimum</tspan><tspan x="93" dy="18">project…</tspan></text><circle cx="75" cy="289" r="5" fill="#55d8ff" fill-opacity="0.88"/>
