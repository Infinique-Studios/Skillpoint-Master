      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Use semantic HTML for headings,</tspan><tspan x="67" dy="20">navigation, main content,</tspan><tspan x="67" dy="20">sections,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Labels must connect to controls</tspan></text><text x="67" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">appropriate input types aid</tspan><tspan x="67" dy="20">validation/accessibility.</tspan></text><text x="67" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Relative paths and alt text</tspan><tspan x="67" dy="20">matter.</tspan></text><path d="M402 374H416" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
