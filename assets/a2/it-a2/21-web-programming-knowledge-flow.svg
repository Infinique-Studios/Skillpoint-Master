      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">JavaScript fundamentals</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Declare variables with let/const,</tspan><tspan x="445" dy="20">use correct data types and</tspan><tspan x="445" dy="20">explicit…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Operators, selection and loops</tspan><tspan x="445" dy="20">implement algorithms.</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Functions package behaviour</tspan></text><text x="445" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">arrays store ordered values</tspan></text><path d="M780 374H794" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
