      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Use normal, boundary, invalid and</tspan><tspan x="823" dy="20">extreme tests with expected</tspan><tspan x="823" dy="20">outcomes.</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Browser developer tools reveal</tspan><tspan x="823" dy="20">console, network and DOM errors.</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Trace values and isolate minimal</tspan><tspan x="823" dy="20">failing cases.</tspan></text><text x="823" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Client-side validation improves</tspan><tspan x="823" dy="20">usability but server-side</tspan><tspan x="823" dy="20">validation…</tspan></text></svg>