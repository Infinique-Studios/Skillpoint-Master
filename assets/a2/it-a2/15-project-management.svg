      <text x="83.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">01</text>
      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Project life cycle</tspan></text><circle cx="74" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="92" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">A project is temporary with defined</tspan><tspan x="92" dy="21">outcome.</tspan></text><circle cx="74" cy="352" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="92" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Scope creep is uncontrolled</tspan><tspan x="92" dy="21">expansion.</tspan></text><circle cx="74" cy="423" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="92" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Post-implementation review feeds</tspan><tspan x="92" dy="21">future…</tspan></text><circle cx="74" cy="494" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="92" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Initiation defines business case,</tspan><tspan x="92" dy="21">objectives,…</tspan></text><path d="M396 372H420" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#55d8ff" fill-opacity=".12" stroke="#55d8ff" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Planning tools</tspan></text><circle cx="456" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="474" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Dependency types and lag matter.</tspan></text><circle cx="456" cy="346" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Critical path can change after</tspan><tspan x="474" dy="21">delays.</tspan></text><circle cx="456" cy="417" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="474" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Contingency is planned response, not</tspan><tspan x="474" dy="21">vague…</tspan></text><circle cx="456" cy="488" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="474" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Work breakdown structure decomposes</tspan><tspan x="474" dy="21">deliverables.</tspan></text><path d="M778 372H802" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#55d8ff" fill-opacity=".12" stroke="#55d8ff" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Software, people and</tspan><tspan x="834" dy="28">control</tspan></text><circle cx="838" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="856" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Software does not manage people</tspan><tspan x="856" dy="21">automatically.</tspan></text><circle cx="838" cy="352" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="856" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Baseline allows variance</tspan><tspan x="856" dy="21">measurement.</tspan></text><circle cx="838" cy="423" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="856" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Escalate exceptions using</tspan><tspan x="856" dy="21">tolerances.</tspan></text><circle cx="838" cy="494" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="856" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Software supports scheduling,</tspan><tspan x="856" dy="21">collaboration,…</tspan></text></svg>