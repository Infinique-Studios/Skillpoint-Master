      <text x="83.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">01</text>
      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">HTML and CSS</tspan></text><circle cx="74" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="92" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Separate structure from</tspan><tspan x="92" dy="21">presentation.</tspan></text><circle cx="74" cy="352" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="92" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Use external CSS for consistency.</tspan></text><circle cx="74" cy="417" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="92" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Keyboard focus and contrast are</tspan><tspan x="92" dy="21">requirements.</tspan></text><circle cx="74" cy="488" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="92" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Use semantic HTML for headings,</tspan><tspan x="92" dy="21">navigation,…</tspan></text><path d="M396 372H420" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#55d8ff" fill-opacity=".12" stroke="#55d8ff" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">JavaScript fundamentals</tspan></text><circle cx="456" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="474" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Use === to avoid coercion surprises.</tspan></text><circle cx="456" cy="346" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Keep variables scoped.</tspan></text><circle cx="456" cy="411" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Validate empty, type, range, format</tspan><tspan x="474" dy="21">and…</tspan></text><circle cx="456" cy="482" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Declare variables with let/const,</tspan><tspan x="474" dy="21">use…</tspan></text><path d="M778 372H802" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#55d8ff" fill-opacity=".12" stroke="#55d8ff" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Testing and security</tspan></text><circle cx="838" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="856" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Sanitise/encode untrusted output.</tspan></text><circle cx="838" cy="346" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">A hidden field is not secure.</tspan></text><circle cx="838" cy="411" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Comment why, not obvious syntax.</tspan></text><circle cx="838" cy="476" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="856" y="481" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Use normal, boundary, invalid and</tspan><tspan x="856" dy="21">extreme…</tspan></text></svg>