      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">AI systems perform tasks</tspan><tspan x="67" dy="20">associated with perception,</tspan><tspan x="67" dy="20">language,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Machine learning learns</tspan><tspan x="67" dy="20">statistical patterns from training</tspan><tspan x="67" dy="20">data</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">expert systems use knowledge base,</tspan><tspan x="67" dy="20">rules and inference engine.</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Robotics combines sensors,</tspan><tspan x="67" dy="20">control, actuators and feedback.</tspan></text><path d="M402 374H416" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
