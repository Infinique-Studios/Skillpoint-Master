      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Treatment and resistance</tspan></text><circle cx="838" cy="281" r="5" fill="#5ee38f" fill-opacity="1"/><text x="856" y="286" fill="#5ee38f" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">resistance is population evolution</tspan></text><circle cx="838" cy="346" r="5" fill="#5ee38f" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">culture/sensitivity guides treatment</tspan></text><circle cx="838" cy="411" r="5" fill="#5ee38f" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Antibiotics target bacterial</tspan><tspan x="856" dy="21">structures/processes…</tspan></text><circle cx="838" cy="482" r="5" fill="#5ee38f" fill-opacity="0.52"/><text x="856" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Random resistant variants survive</tspan><tspan x="856" dy="21">selection,…</tspan></text></svg>