      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Pathogens and transmission</tspan></text><circle cx="74" cy="281" r="5" fill="#5ee38f" fill-opacity="1"/><text x="92" y="286" fill="#5ee38f" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">infectious ≠ non-communicable</tspan></text><circle cx="74" cy="346" r="5" fill="#5ee38f" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">vectors transmit between hosts</tspan></text><circle cx="74" cy="411" r="5" fill="#5ee38f" fill-opacity="0.6799999999999999"/><text x="92" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Pathogens include bacteria, viruses,</tspan><tspan x="92" dy="21">fungi…</tspan></text><circle cx="74" cy="482" r="5" fill="#5ee38f" fill-opacity="0.52"/><text x="92" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Named syllabus diseases should be</tspan><tspan x="92" dy="21">linked…</tspan></text><path d="M396 372H420" stroke="#5ee38f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#5ee38f" stroke-opacity=".26"/></g>
