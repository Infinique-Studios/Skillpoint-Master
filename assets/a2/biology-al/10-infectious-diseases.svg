      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Prevention and public</tspan><tspan x="452" dy="28">health</tspan></text><circle cx="456" cy="281" r="5" fill="#5ee38f" fill-opacity="1"/><text x="474" y="286" fill="#5ee38f" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">evaluate cost/access/compliance</tspan></text><circle cx="456" cy="346" r="5" fill="#5ee38f" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">use rates per population</tspan></text><circle cx="456" cy="411" r="5" fill="#5ee38f" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Clean water/sanitation, food</tspan><tspan x="474" dy="21">hygiene,…</tspan></text><circle cx="456" cy="482" r="5" fill="#5ee38f" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Herd effects protect susceptible</tspan><tspan x="474" dy="21">people…</tspan></text><path d="M778 372H802" stroke="#5ee38f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#5ee38f" stroke-opacity=".26"/></g>
