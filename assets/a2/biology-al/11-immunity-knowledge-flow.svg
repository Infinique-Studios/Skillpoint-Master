<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Immunity — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Immunity</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ee38f" stop-opacity=".18"/><stop offset="1" stop-color="#5ee38f" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#5ee38f"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#5ee38f" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#5ee38f" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9700 · 11</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Immunity — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Innate and antigen</tspan><tspan x="222" dy="25">presentation</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Phagocytes recognise, engulf and</tspan><tspan x="67" dy="20">digest pathogens in phagosomes</tspan><tspan x="67" dy="20">fused…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Antigens displayed on MHC activate</tspan><tspan x="67" dy="20">specific T helper cells.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Innate barriers/responses are</tspan><tspan x="67" dy="20">rapid and non-specific</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">adaptive responses are specific</tspan><tspan x="67" dy="20">and form memory.</tspan></text><path d="M402 374H416" stroke="#5ee38f" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Lymphocytes and antibodies</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Clonal selection activates</tspan><tspan x="445" dy="20">complementary B/T cells.</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">T helper cytokines activate B</tspan><tspan x="445" dy="20">cells and cytotoxic T cells</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">plasma cells secrete antibodies</tspan></text><text x="445" y="442" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">memory cells persist.</tspan></text><path d="M780 374H794" stroke="#5ee38f" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Vaccination and monoclonals</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Vaccines present safe antigens,</tspan><tspan x="823" dy="20">causing primary response/memory</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">boosters raise memory/antibody.</tspan></text><text x="823" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Herd immunity reduces spread.</tspan></text><text x="823" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Monoclonal antibodies come from</tspan><tspan x="823" dy="20">one clone/hybridoma and are used</tspan><tspan x="823" dy="20">in…</tspan></text></svg>