<text x="52" y="43" fill="#5ee38f" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9700 · 5</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">The Mitotic Cell Cycle — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Cell cycle</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Interphase includes G1</tspan><tspan x="67" dy="20">growth/protein synthesis, S DNA</tspan><tspan x="67" dy="20">replication,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">M phase includes mitosis and</tspan><tspan x="67" dy="20">cytokinesis.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">DNA amount doubles in S but</tspan><tspan x="67" dy="20">chromosome number changes only</tspan><tspan x="67" dy="20">when…</tspan></text><path d="M402 374H416" stroke="#5ee38f" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Mitosis</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Prophase chromosomes condense and</tspan><tspan x="445" dy="20">spindle forms</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">metaphase chromosomes align at</tspan><tspan x="445" dy="20">equator</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">anaphase centromeres divide and</tspan><tspan x="445" dy="20">chromatids move to poles</tspan></text><text x="445" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">telophase nuclei reform</tspan></text><path d="M780 374H794" stroke="#5ee38f" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Significance and cancer</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Mitosis enables growth, cell</tspan><tspan x="823" dy="20">replacement, repair and</tspan><tspan x="823" dy="20">cloning/asexual…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Mutations in</tspan><tspan x="823" dy="20">proto-oncogenes/tumour suppressors</tspan><tspan x="823" dy="20">disrupt…</tspan></text></svg>