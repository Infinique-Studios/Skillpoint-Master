      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Bar/pie/pictogram, stem-and-leaf,</tspan><tspan x="445" dy="20">frequency tables.</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Histograms frequency density for</tspan><tspan x="445" dy="20">unequal widths</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">cumulative frequency gives</tspan><tspan x="445" dy="20">median/quartiles/percentiles and</tspan><tspan x="445" dy="20">box…</tspan></text><path d="M780 374H794" stroke="#c89bff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Scatter/time series</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Scatter correlation</tspan><tspan x="823" dy="20">positive/negative/none</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">line of best fit estimates within</tspan><tspan x="823" dy="20">data, no causation.</tspan></text><text x="823" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Time series trends/seasonality and</tspan><tspan x="823" dy="20">moving averages where required.</tspan></text><text x="823" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Compare distributions</tspan><tspan x="823" dy="20">centre+spread.</tspan></text></svg>