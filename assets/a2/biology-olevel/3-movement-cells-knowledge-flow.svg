<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Movement Into and Out of Cells — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Movement Into and Out of Cells</desc>
