      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Greenhouse and fertilisers</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">CO2, CH4 absorb outgoing IR,</tspan><tspan x="823" dy="20">enhancing greenhouse effect and</tspan><tspan x="823" dy="20">climate…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Nitrogen fertilisers raise yield</tspan></text><text x="823" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">excess nitrate/phosphate runoff</tspan><tspan x="823" dy="20">causes eutrophication: algal</tspan><tspan x="823" dy="20">bloom,…</tspan></text><text x="823" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Haber ammonia supports fertiliser</tspan><tspan x="823" dy="20">production.</tspan></text></svg>