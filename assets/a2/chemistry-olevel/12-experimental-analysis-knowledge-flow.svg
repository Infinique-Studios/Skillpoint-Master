      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Know gas tests: H2 pop, O2</tspan><tspan x="823" dy="20">relights, CO2 limewater, NH3 damp</tspan><tspan x="823" dy="20">red→blue,…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Flame tests and NaOH/NH3 cation</tspan><tspan x="823" dy="20">precipitates, acidified silver</tspan><tspan x="823" dy="20">halides…</tspan></text></svg>