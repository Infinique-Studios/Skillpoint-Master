      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Water</tspan></text><circle cx="74" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="92" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">dissolved salts may be acceptable</tspan></text><circle cx="74" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">evaluate energy/cost</tspan></text><circle cx="74" cy="411" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="92" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Test purity by fixed mp/bp</tspan></text><circle cx="74" cy="476" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="92" y="481" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">potable means safe, not pure.</tspan></text><path d="M396 372H420" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
