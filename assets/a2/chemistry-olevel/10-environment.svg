      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Atmosphere and pollution</tspan></text><circle cx="456" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="474" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">pollutant source→effect→control</tspan></text><circle cx="456" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">balance combustion</tspan></text><circle cx="456" cy="411" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Dry air ~78% N2,21% O2, noble</tspan><tspan x="474" dy="21">gases/CO2.</tspan></text><circle cx="456" cy="482" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">CO from incomplete combustion toxic</tspan></text><path d="M778 372H802" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
