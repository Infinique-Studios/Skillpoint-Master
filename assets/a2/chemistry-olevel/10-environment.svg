      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Greenhouse and fertilisers</tspan></text><circle cx="838" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="856" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">natural vs enhanced greenhouse</tspan></text><circle cx="838" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">state evidence/mitigation</tspan></text><circle cx="838" cy="411" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">CO2, CH4 absorb outgoing IR,</tspan><tspan x="856" dy="21">enhancing…</tspan></text><circle cx="838" cy="482" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="856" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Nitrogen fertilisers raise yield</tspan></text></svg>