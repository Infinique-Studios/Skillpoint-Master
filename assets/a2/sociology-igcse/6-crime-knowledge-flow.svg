<text x="52" y="43" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 0495 · 6</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Crime, Deviance and Social Control — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Definitions and data</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Crime/deviance relative to</tspan><tspan x="67" dy="20">culture/time</tspan></text><text x="67" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">formal/informal control.</tspan></text><text x="67" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Official statistics undercount</tspan><tspan x="67" dy="20">hidden crime and reflect</tspan><tspan x="67" dy="20">reporting/recording/policing</tspan></text><text x="67" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">victim/self-report add evidence</tspan><tspan x="67" dy="20">but have memory/honesty limits.</tspan></text><path d="M402 374H416" stroke="#ff9fcb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Explanations/patterns</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Functionalism anomie/boundary</tspan></text><text x="445" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">strain/subculture</tspan></text><text x="445" y="352" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Marxism power/white-collar</tspan></text><text x="445" y="402" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">feminism gender/patriarchy</tspan></text><path d="M780 374H794" stroke="#ff9fcb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Control and punishment</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Police/courts/prison, deterrence,</tspan><tspan x="823" dy="20">rehabilitation, restorative</tspan><tspan x="823" dy="20">justice,…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Evaluate effectiveness, rights,</tspan><tspan x="823" dy="20">bias, reoffending and social</tspan><tspan x="823" dy="20">causes.</tspan></text></svg>