      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">A bitmap stores a file header plus</tspan><tspan x="445" dy="20">a grid of pixels.</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Resolution gives pixel dimensions</tspan><tspan x="445" dy="20">and colour depth gives bits per</tspan><tspan x="445" dy="20">pixel</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">increasing either usually improves</tspan><tspan x="445" dy="20">potential detail but enlarges the</tspan><tspan x="445" dy="20">uncompressed…</tspan></text><text x="445" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">A vector graphic stores drawing</tspan><tspan x="445" dy="20">objects and properties, so it</tspan><tspan x="445" dy="20">scales…</tspan></text><path d="M780 374H794" stroke="#4dd7ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
