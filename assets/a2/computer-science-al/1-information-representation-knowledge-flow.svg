      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Binary place values are powers of</tspan><tspan x="67" dy="20">two</tspan></text><text x="67" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">hexadecimal groups four bits per</tspan><tspan x="67" dy="20">digit and BCD stores each denary</tspan><tspan x="67" dy="20">digit…</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Fixed-width addition can overflow.</tspan></text><text x="67" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Two’s complement uses the most</tspan><tspan x="67" dy="20">significant place as a negative</tspan><tspan x="67" dy="20">weight,…</tspan></text><path d="M402 374H416" stroke="#4dd7ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
