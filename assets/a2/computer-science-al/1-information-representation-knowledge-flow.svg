      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Compression</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Compression reduces storage and</tspan><tspan x="823" dy="20">transmission demand.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Lossless methods preserve every</tspan><tspan x="823" dy="20">original bit and suit text,</tspan><tspan x="823" dy="20">program…</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Lossy methods discard selected</tspan><tspan x="823" dy="20">information and suit perceptual</tspan><tspan x="823" dy="20">media…</tspan></text><text x="823" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Run-length encoding replaces</tspan><tspan x="823" dy="20">repeated sequences with</tspan><tspan x="823" dy="20">value–count…</tspan></text></svg>