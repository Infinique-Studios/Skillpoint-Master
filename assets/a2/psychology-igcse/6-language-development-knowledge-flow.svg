<text x="52" y="43" fill="#b8a1ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 0266 · 6</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Language Development — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#b8a1ff" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#b8a1ff" fill-opacity=".13" stroke="#b8a1ff" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#b8a1ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Development and theories</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Stages from babbling to one-word,</tspan><tspan x="67" dy="20">two-word/telegraphic and complex</tspan><tspan x="67" dy="20">grammar.</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Nativist language-acquisition</tspan><tspan x="67" dy="20">mechanisms/critical period</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">learning reinforcement/imitation</tspan></text><text x="67" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">interactionist social support.</tspan></text><path d="M402 374H416" stroke="#b8a1ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#b8a1ff" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#b8a1ff" fill-opacity=".13" stroke="#b8a1ff" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#b8a1ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Social and cognitive factors</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Child-directed speech, joint</tspan><tspan x="445" dy="20">attention, scaffolding, feedback,</tspan><tspan x="445" dy="20">schemas…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Bilingualism/sign language inform</tspan><tspan x="445" dy="20">critical-period and modality</tspan><tspan x="445" dy="20">debates.</tspan></text><path d="M780 374H794" stroke="#b8a1ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#b8a1ff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#b8a1ff" fill-opacity=".13" stroke="#b8a1ff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#b8a1ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Research/application</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Longitudinal observation,</tspan><tspan x="823" dy="20">transcripts, experiments and case</tspan><tspan x="823" dy="20">studies</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">rich validity but small</tspan><tspan x="823" dy="20">samples/observer interpretation.</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Applications education and</tspan><tspan x="823" dy="20">intervention.</tspan></text></svg>