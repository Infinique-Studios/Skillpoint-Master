<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">The Basic Economic Problem — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for The Basic Economic Problem</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00ff88" stop-opacity=".18"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#00ff88"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#00ff88" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#00ff88" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 2281 · 1</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">The Basic Economic Problem — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Scarcity and choice</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Economic goods use scarce</tspan><tspan x="67" dy="20">resources and have opportunity</tspan><tspan x="67" dy="20">cost</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">free goods are abundant in the</tspan><tspan x="67" dy="20">relevant context.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Every choice forgoes the next best</tspan><tspan x="67" dy="20">alternative.</tspan></text><path d="M402 374H416" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Factors of production</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Land, labour, capital and</tspan><tspan x="445" dy="20">enterprise earn rent, wages,</tspan><tspan x="445" dy="20">interest…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Quantity, quality, mobility,</tspan><tspan x="445" dy="20">specialisation and</tspan><tspan x="445" dy="20">entrepreneurship…</tspan></text><path d="M780 374H794" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Production possibility curves</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">A PPC shows maximum combinations</tspan><tspan x="823" dy="20">with current resources/technology.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">On curve efficient, inside</tspan><tspan x="823" dy="20">unemployed/inefficient, outside</tspan><tspan x="823" dy="20">unattainable.</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Movement has opportunity cost</tspan></text><text x="823" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">outward shift economic growth.</tspan></text></svg>