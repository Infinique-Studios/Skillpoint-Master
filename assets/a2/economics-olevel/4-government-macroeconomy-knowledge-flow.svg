<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Government and the Macroeconomy — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Aims and indicators</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Growth measured real GDP,</tspan><tspan x="67" dy="20">unemployment proportion</tspan><tspan x="67" dy="20">willing/able…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Aims can conflict.</tspan></text><path d="M402 374H416" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Causes and consequences</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Growth from factors/productivity</tspan></text><text x="445" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">unemployment</tspan><tspan x="445" dy="20">cyclical/structural/frictional</tspan></text><text x="445" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">inflation demand-pull/cost-push.</tspan></text><text x="445" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Effects differ for households,</tspan><tspan x="445" dy="20">firms, government and external</tspan><tspan x="445" dy="20">competitiveness.</tspan></text><path d="M780 374H794" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Policies</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Fiscal taxation/spending, monetary</tspan><tspan x="823" dy="20">interest/money/credit, supply-side</tspan><tspan x="823" dy="20">education/infrastructure/deregulation.</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Expansionary demand policy raises</tspan><tspan x="823" dy="20">output/jobs but may inflate/import</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">contractionary opposite.</tspan></text></svg>