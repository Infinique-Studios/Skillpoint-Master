<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Economic Development — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Economic Development</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00ff88" stop-opacity=".18"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#00ff88"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#00ff88" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#00ff88" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 2281 · 5</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Economic Development — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Living standards and</tspan><tspan x="222" dy="25">indicators</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Real GDP per head measures average</tspan><tspan x="67" dy="20">output but omits distribution,</tspan><tspan x="67" dy="20">unpaid…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">HDI combines income, education and</tspan><tspan x="67" dy="20">life expectancy.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Other health, access and</tspan><tspan x="67" dy="20">subjective indicators matter.</tspan></text><path d="M402 374H416" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Poverty and inequality</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Absolute vs relative poverty</tspan></text><text x="445" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">causes low skills, unemployment,</tspan><tspan x="445" dy="20">discrimination, poor</tspan><tspan x="445" dy="20">services/assets.</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Lorenz/Gini show distribution.</tspan></text><text x="445" y="442" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Taxes, transfers, minimum wages</tspan><tspan x="445" dy="20">and public services redistribute</tspan><tspan x="445" dy="20">with…</tspan></text><path d="M780 374H794" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#00ff88" fill-opacity=".13" stroke="#00ff88" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Population and development</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Birth/death rates, migration and</tspan><tspan x="823" dy="20">age structure change labour</tspan><tspan x="823" dy="20">force/dependency.</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Population growth can expand</tspan><tspan x="823" dy="20">market/workforce or strain</tspan><tspan x="823" dy="20">jobs/services/resources.</tspan></text><text x="823" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Development changes sector</tspan><tspan x="823" dy="20">structure and urbanisation.</tspan></text></svg>