<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Algorithm Design and Problem-Solving — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Algorithm Design and Problem-Solving</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4dd7ff" stop-opacity=".18"/><stop offset="1" stop-color="#4dd7ff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#4dd7ff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#4dd7ff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 2210 · 7</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Algorithm Design and Problem-Solving — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#4dd7ff" fill-opacity=".13" stroke="#4dd7ff" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Development and decomposition</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">A problem is divided into</tspan><tspan x="67" dy="20">subsystems and modules with clear</tspan><tspan x="67" dy="20">inputs,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Requirements and success criteria</tspan><tspan x="67" dy="20">are stated before design.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Pseudocode and flowcharts</tspan><tspan x="67" dy="20">represent sequence, selection and</tspan><tspan x="67" dy="20">iteration.</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Each step must be executable and</tspan><tspan x="67" dy="20">unambiguous</tspan></text><path d="M402 374H416" stroke="#4dd7ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#4dd7ff" fill-opacity=".13" stroke="#4dd7ff" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Standard algorithms</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Linear search checks items in</tspan><tspan x="445" dy="20">order.</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Bubble sort compares adjacent</tspan><tspan x="445" dy="20">values and swaps if out of order</tspan><tspan x="445" dy="20">across…</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Totalling, counting, average and</tspan><tspan x="445" dy="20">min/max patterns need correct</tspan><tspan x="445" dy="20">initialisation.</tspan></text><text x="445" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Trace algorithms with small data,</tspan><tspan x="445" dy="20">recording array changes and loop</tspan><tspan x="445" dy="20">control.</tspan></text><path d="M780 374H794" stroke="#4dd7ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#4dd7ff" fill-opacity=".13" stroke="#4dd7ff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Validation and testing</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Validation checks rules</tspan></text><text x="823" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">verification checks accurate</tspan><tspan x="823" dy="20">entry/transfer.</tspan></text><text x="823" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Normal, boundary, invalid and</tspan><tspan x="823" dy="20">extreme data test different</tspan><tspan x="823" dy="20">requirements.</tspan></text><text x="823" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">A trace table records variable</tspan><tspan x="823" dy="20">state and output.</tspan></text></svg>