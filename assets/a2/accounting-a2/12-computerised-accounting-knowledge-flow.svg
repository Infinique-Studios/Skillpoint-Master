<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#ffd166" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#ffd166" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9706 · 3.4</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Computerised Accounting Systems — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffd166" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#ffd166" fill-opacity=".13" stroke="#ffd166" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#ffd166" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">System features</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Integrated modules, real-time</tspan><tspan x="67" dy="20">posting, databases, audit trail,</tspan><tspan x="67" dy="20">dashboards,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Benefits</tspan><tspan x="67" dy="20">speed/accuracy/access/scalability.</tspan></text><path d="M402 374H416" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffd166" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ffd166" fill-opacity=".13" stroke="#ffd166" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ffd166" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Controls and risks</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Access roles/MFA, authorisation,</tspan><tspan x="445" dy="20">validation, segregation, backups,</tspan><tspan x="445" dy="20">logs,…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Risks cyberattack, input errors at</tspan><tspan x="445" dy="20">scale, outage, vendor dependency.</tspan></text><path d="M780 374H794" stroke="#ffd166" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffd166" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ffd166" fill-opacity=".13" stroke="#ffd166" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ffd166" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Evaluation and AI</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Selection/implementation,</tspan><tspan x="823" dy="20">migration, training, cost and</tspan><tspan x="823" dy="20">ethics.</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">AI supports</tspan><tspan x="823" dy="20">classification/anomaly/forecasting</tspan><tspan x="823" dy="20">but…</tspan></text></svg>