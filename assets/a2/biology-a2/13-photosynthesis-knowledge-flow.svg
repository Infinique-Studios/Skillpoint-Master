<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Photosynthesis — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Photosynthesis</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ee38f" stop-opacity=".18"/><stop offset="1" stop-color="#5ee38f" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#5ee38f"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#5ee38f" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#5ee38f" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9700 · 13</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Photosynthesis — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Chloroplasts, pigments and</tspan><tspan x="222" dy="25">light…</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Grana provide a large thylakoid</tspan><tspan x="67" dy="20">membrane area containing</tspan><tspan x="67" dy="20">chlorophyll,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">The stroma contains enzymes,</tspan><tspan x="67" dy="20">including rubisco, for carbon</tspan><tspan x="67" dy="20">fixation.</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Starch grains temporarily store</tspan><tspan x="67" dy="20">carbohydrate</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">circular DNA and 70S ribosomes</tspan><tspan x="67" dy="20">support some protein synthesis.</tspan></text><path d="M402 374H416" stroke="#5ee38f" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Light-dependent reactions</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Light excites electrons in</tspan><tspan x="445" dy="20">photosystem II.</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Electrons pass through carriers,</tspan><tspan x="445" dy="20">releasing energy to pump H+ into</tspan><tspan x="445" dy="20">the…</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Photolysis replaces electrons and</tspan><tspan x="445" dy="20">produces O2 and H+.</tspan></text><text x="445" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Proton flow through ATP synthase</tspan><tspan x="445" dy="20">makes ATP.</tspan></text><path d="M780 374H794" stroke="#5ee38f" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#5ee38f" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#5ee38f" fill-opacity=".13" stroke="#5ee38f" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Calvin cycle and limiting</tspan><tspan x="978" dy="25">factors</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Rubisco combines CO2 with RuBP</tspan><tspan x="823" dy="20">(5C), forming an unstable 6C</tspan><tspan x="823" dy="20">compound…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">ATP and reduced NADP convert GP to</tspan><tspan x="823" dy="20">triose phosphate.</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Most TP regenerates RuBP using ATP</tspan></text><text x="823" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">some makes hexose, sucrose,</tspan><tspan x="823" dy="20">starch, cellulose, lipids and</tspan><tspan x="823" dy="20">amino…</tspan></text></svg>