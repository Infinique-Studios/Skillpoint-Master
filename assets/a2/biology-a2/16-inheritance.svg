      <text x="465.5" y="168" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Genetic crosses and</tspan><tspan x="452" dy="28">statistical…</tspan></text><circle cx="456" cy="281" r="5" fill="#5ee38f" fill-opacity="1"/><text x="474" y="286" fill="#5ee38f" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Null hypothesis: differences are due</tspan><tspan x="474" dy="21">to…</tspan></text><circle cx="456" cy="352" r="5" fill="#5ee38f" fill-opacity="0.84"/><text x="474" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">χ² below critical value → do not</tspan><tspan x="474" dy="21">reject…</tspan></text><circle cx="456" cy="423" r="5" fill="#5ee38f" fill-opacity="0.6799999999999999"/><text x="474" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Use counts, not percentages, in χ²</tspan><tspan x="474" dy="21">terms.</tspan></text><circle cx="456" cy="494" r="5" fill="#5ee38f" fill-opacity="0.52"/><text x="474" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Use symbols defined before a cross,</tspan><tspan x="474" dy="21">list…</tspan></text><path d="M778 372H802" stroke="#5ee38f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#5ee38f" stroke-opacity=".26"/></g>
