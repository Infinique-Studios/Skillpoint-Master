      <text x="847.5" y="168" text-anchor="middle" fill="#5ee38f" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Gene expression and control</tspan></text><circle cx="838" cy="281" r="5" fill="#5ee38f" fill-opacity="1"/><text x="856" y="286" fill="#5ee38f" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Genetic code is degenerate,</tspan><tspan x="856" dy="21">universal…</tspan></text><circle cx="838" cy="352" r="5" fill="#5ee38f" fill-opacity="0.84"/><text x="856" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Promoter is RNA-polymerase binding</tspan><tspan x="856" dy="21">region;…</tspan></text><circle cx="838" cy="423" r="5" fill="#5ee38f" fill-opacity="0.6799999999999999"/><text x="856" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Phenotype also depends on</tspan><tspan x="856" dy="21">environment.</tspan></text><circle cx="838" cy="494" r="5" fill="#5ee38f" fill-opacity="0.52"/><text x="856" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">A gene’s template strand is</tspan><tspan x="856" dy="21">transcribed…</tspan></text></svg>