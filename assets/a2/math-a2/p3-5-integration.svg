<text x="52" y="43" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">CONCEPT MAP · 9709 · P3.5</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Integration — concept map</tspan></text>
<g filter="url(#shadow)"><rect x="42" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
