<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Algebra — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Algebra</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c89bff" stop-opacity=".18"/><stop offset="1" stop-color="#c89bff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#c89bff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#c89bff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9709 · P3.1</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Algebra — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Modulus and graphs</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">|x| is distance from zero</tspan></text><text x="67" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">|f(x)| reflects negative parts of</tspan><tspan x="67" dy="20">y=f(x) above x-axis, while f(|x|)</tspan><tspan x="67" dy="20">mirrors…</tspan></text><text x="67" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Solve equations by intersections</tspan><tspan x="67" dy="20">or cases, and inequalities by</tspan><tspan x="67" dy="20">critical…</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">For |ax+b|0, use −cc use two outer</tspan><tspan x="67" dy="20">cases.</tspan></text><path d="M402 374H416" stroke="#c89bff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Polynomials and partial</tspan><tspan x="600" dy="25">fractions</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Remainder theorem: remainder on</tspan><tspan x="445" dy="20">division by x−a is f(a)</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">factor theorem: x−a factor iff</tspan><tspan x="445" dy="20">f(a)=0.</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Polynomial division handles</tspan><tspan x="445" dy="20">improper rational functions before</tspan><tspan x="445" dy="20">partial…</tspan></text><text x="445" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Use A/(linear),</tspan><tspan x="445" dy="20">A/(linear)+B/(linear)² for</tspan><tspan x="445" dy="20">repeated…</tspan></text><path d="M780 374H794" stroke="#c89bff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Binomial series</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">For any real n,</tspan><tspan x="823" dy="20">(1+x)^n=1+nx+n(n−1)x²/2!+… valid</tspan><tspan x="823" dy="20">for…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Factor constants to create 1+x and</tspan><tspan x="823" dy="20">state the range after</tspan><tspan x="823" dy="20">substitution.</tspan></text><text x="823" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">For positive integer n expansion</tspan><tspan x="823" dy="20">terminates and is valid all x.</tspan></text><text x="823" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Use enough terms to meet requested</tspan><tspan x="823" dy="20">power and watch products of</tspan><tspan x="823" dy="20">series.</tspan></text></svg>