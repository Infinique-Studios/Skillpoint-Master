    <circle cx="655" cy="200" r="5" fill="#ffc857" fill-opacity="1"/>
        <text x="673" y="205" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">(uv)′=u′v+uv′</tspan></text>
        <text x="673" y="230" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Product rule — Differentiable functions</tspan></text><circle cx="655" cy="271" r="5" fill="#ffc857" fill-opacity="0.88"/>
        <text x="673" y="276" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">d/dx f(g(x))=f′(g)g′</tspan></text>
