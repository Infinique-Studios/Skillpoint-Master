        <text x="673" y="347" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">dy/dx=(dy/dt)/(dx/dt)</tspan></text>
        <text x="673" y="372" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Parametric derivative — dx/dt≠0</tspan></text><circle cx="655" cy="413" r="5" fill="#ffc857" fill-opacity="0.64"/>
        <text x="673" y="418" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">d²y/dx²=[d/dt(dy/dx)]/(dx/dt)</tspan></text>
        <text x="673" y="443" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Parametric second derivative — dx/dt≠0</tspan></text>
