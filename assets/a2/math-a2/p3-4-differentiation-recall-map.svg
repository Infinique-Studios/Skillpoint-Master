        <text x="93" y="205" text-anchor="start" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="93" dy="0">Stationary point</tspan></text>
        <text x="93" y="230" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Point where dy/dx=0.</tspan></text><circle cx="75" cy="271" r="5" fill="#c89bff" fill-opacity="0.88"/>
