        <text x="93" y="301" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Equation where y is not isolated as explicit</tspan><tspan x="93" dy="18">function…</tspan></text><circle cx="75" cy="360" r="5" fill="#c89bff" fill-opacity="0.76"/>
        <text x="93" y="365" text-anchor="start" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="93" dy="0">Related rates</tspan></text>
