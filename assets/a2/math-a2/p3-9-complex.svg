<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Complex Numbers — concept map</title><desc id="description">Aligned three-part concept map for Complex Numbers</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c89bff" stop-opacity=".18"/><stop offset="1" stop-color="#c89bff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#c89bff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#c89bff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">CONCEPT MAP · 9709 · P3.9</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Complex Numbers — concept map</tspan></text>
<g filter="url(#shadow)"><rect x="42" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
      <rect x="64" y="143" width="39" height="39" rx="12" fill="#c89bff" fill-opacity=".12" stroke="#c89bff" stroke-opacity=".45"/>
      <text x="83.5" y="168" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700">01</text>
      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Cartesian form and geometry</tspan></text><circle cx="74" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="92" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Principal argument usually −π&lt;arg</tspan><tspan x="92" dy="21">z≤π.</tspan></text><circle cx="74" cy="352" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="92" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">zz*=|z|².</tspan></text><circle cx="74" cy="417" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="92" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Conjugate roots occur for</tspan><tspan x="92" dy="21">real-coefficient…</tspan></text><circle cx="74" cy="488" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="92" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">z=x+iy, Re z=x, Im z=y, conjugate</tspan><tspan x="92" dy="21">z*=x−iy,…</tspan></text><path d="M396 372H420" stroke="#c89bff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#c89bff" fill-opacity=".12" stroke="#c89bff" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Polar form and de Moivre</tspan></text><circle cx="456" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="474" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Arguments differ by 2πk.</tspan></text><circle cx="456" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Modulus is non-negative.</tspan></text><circle cx="456" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Powers rotate and scale.</tspan></text><circle cx="456" cy="476" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="474" y="481" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">z=r(cosθ+i sinθ)=re^{iθ}.</tspan></text><path d="M778 372H802" stroke="#c89bff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#c89bff" fill-opacity=".12" stroke="#c89bff" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Roots and equations</tspan></text><circle cx="838" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="856" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">List exactly n distinct roots.</tspan></text><circle cx="838" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Use all k values.</tspan></text><circle cx="838" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Sketch roots for checking symmetry.</tspan></text><circle cx="838" cy="476" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="856" y="481" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">For z^n=Re^{iφ}, roots have modulus</tspan><tspan x="856" dy="21">R^{1/n}…</tspan></text></svg>