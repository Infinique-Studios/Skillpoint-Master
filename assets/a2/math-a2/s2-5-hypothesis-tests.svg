      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Framework</tspan></text><circle cx="74" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="92" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Hypotheses use population parameter.</tspan></text><circle cx="74" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Do not put sample result in H0.</tspan></text><circle cx="74" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="92" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">State exact significance/critical</tspan><tspan x="92" dy="21">rule.</tspan></text><circle cx="74" cy="482" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="92" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">H0 is baseline parameter value</tspan></text><path d="M396 372H420" stroke="#c89bff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
