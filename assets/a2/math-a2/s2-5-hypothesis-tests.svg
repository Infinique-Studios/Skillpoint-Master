      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Errors and context</tspan></text><circle cx="838" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="856" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Name context and parameter</tspan><tspan x="856" dy="21">direction.</tspan></text><circle cx="838" cy="352" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="856" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Distinguish test error from</tspan><tspan x="856" dy="21">data/measurement…</tspan></text><circle cx="838" cy="423" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="856" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Check model assumptions.</tspan></text><circle cx="838" cy="488" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="856" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Type I rejects true H0</tspan></text></svg>