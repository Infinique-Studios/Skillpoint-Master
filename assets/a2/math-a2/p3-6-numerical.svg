      <text x="465.5" y="168" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Fixed-point iteration</tspan></text><circle cx="456" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="474" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Use previous unrounded value.</tspan></text><circle cx="456" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Do not round each iteration heavily.</tspan></text><circle cx="456" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">A cobweb diagram shows</tspan><tspan x="474" dy="21">convergence/oscillation.</tspan></text><circle cx="456" cy="482" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Rearrange f(x)=0 to x=F(x), choose</tspan><tspan x="474" dy="21">x0…</tspan></text><path d="M778 372H802" stroke="#c89bff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#c89bff" fill-opacity=".12" stroke="#c89bff" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Error and interpretation</tspan></text><circle cx="838" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="856" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Check f(approx) near zero.</tspan></text><circle cx="838" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">State interval/root chosen.</tspan></text><circle cx="838" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Preserve calculator precision.</tspan></text><circle cx="838" cy="476" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="856" y="481" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Consecutive iterates being close is</tspan><tspan x="856" dy="21">evidence,…</tspan></text></svg>