<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Communication and Internet Technologies — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Communication and Internet Technologies</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4dd7ff" stop-opacity=".18"/><stop offset="1" stop-color="#4dd7ff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#4dd7ff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#4dd7ff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9618 · 14</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Communication and Internet Technologies — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#4dd7ff" fill-opacity=".13" stroke="#4dd7ff" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Protocol stacks and services</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Layering separates</tspan><tspan x="67" dy="20">responsibilities and exposes</tspan><tspan x="67" dy="20">interfaces.</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Application protocols define</tspan><tspan x="67" dy="20">services, transport protocols</tspan><tspan x="67" dy="20">manage…</tspan></text><text x="67" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Encapsulation adds headers</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">the receiver decapsulates in</tspan><tspan x="67" dy="20">reverse.</tspan></text><path d="M402 374H416" stroke="#4dd7ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#4dd7ff" fill-opacity=".13" stroke="#4dd7ff" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Switching and routing</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Circuit switching reserves a path</tspan><tspan x="445" dy="20">and capacity for a session, giving</tspan><tspan x="445" dy="20">predictable…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Packet switching shares links and</tspan><tspan x="445" dy="20">routes independent packets,</tspan><tspan x="445" dy="20">improving…</tspan></text><text x="445" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Routers use metrics and tables to</tspan><tspan x="445" dy="20">choose next hops.</tspan></text><text x="445" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Congestion occurs when offered</tspan><tspan x="445" dy="20">load exceeds capacity</tspan></text><path d="M780 374H794" stroke="#4dd7ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#4dd7ff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#4dd7ff" fill-opacity=".13" stroke="#4dd7ff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#4dd7ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Protocol application and</tspan><tspan x="978" dy="25">security</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">HTTP/HTTPS, email and</tspan><tspan x="823" dy="20">file-transfer protocols define</tspan><tspan x="823" dy="20">message…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">TLS authenticates endpoints and</tspan><tspan x="823" dy="20">protects confidentiality/integrity</tspan><tspan x="823" dy="20">in…</tspan></text><text x="823" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">DNS and addressing still have</tspan><tspan x="823" dy="20">separate roles.</tspan></text><text x="823" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Wireless links face interference,</tspan><tspan x="823" dy="20">shared-medium contention and</tspan><tspan x="823" dy="20">eavesdropping.</tspan></text></svg>