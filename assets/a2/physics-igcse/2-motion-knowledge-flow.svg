      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Without air resistance</tspan><tspan x="823" dy="20">acceleration g constant downward.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">With drag increasing, resultant</tspan><tspan x="823" dy="20">falls until terminal speed.</tspan></text><text x="823" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Objects share g independent mass</tspan><tspan x="823" dy="20">in vacuum.</tspan></text></svg>