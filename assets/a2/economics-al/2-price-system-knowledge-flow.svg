      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Consumer/producer surplus</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">CS willingness-to-pay minus price</tspan></text><text x="823" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">PS price minus minimum supply</tspan><tspan x="823" dy="20">price.</tspan></text><text x="823" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Changes depend on equilibrium and</tspan><tspan x="823" dy="20">elasticities</tspan></text><text x="823" y="442" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">diagrams show welfare areas.</tspan></text></svg>