      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Effective demand</tspan></text><text x="67" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">determinants and movements/shifts.</tspan></text><text x="67" y="352" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Calculate/interpret PED, YED, XED</tspan><tspan x="67" dy="20">and PES, including signs,</tspan><tspan x="67" dy="20">straight-line…</tspan></text><path d="M402 374H416" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
