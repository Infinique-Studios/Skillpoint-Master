      <text x="600" y="174" text-anchor="middle" fill="#00ff88" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Equilibrium and linked markets</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Shifts determine P/Q</tspan></text><text x="445" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">joint, alternative and derived</tspan><tspan x="445" dy="20">demand</tspan></text><text x="445" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Price rations, signals and</tspan><tspan x="445" dy="20">incentivises.</tspan></text><path d="M780 374H794" stroke="#00ff88" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#00ff88" stroke-opacity=".22"/></g>
