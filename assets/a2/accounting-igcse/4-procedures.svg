      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Capital, depreciation and</tspan><tspan x="70" dy="28">disposal</tspan></text><circle cx="74" cy="281" r="5" fill="#ffd166" fill-opacity="1"/><text x="92" y="286" fill="#ffd166" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">residual value</tspan></text><circle cx="74" cy="346" r="5" fill="#ffd166" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">accumulated depreciation</tspan></text><circle cx="74" cy="411" r="5" fill="#ffd166" fill-opacity="0.6799999999999999"/><text x="92" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Capital expenditure</tspan><tspan x="92" dy="21">acquires/improves…</tspan></text><circle cx="74" cy="482" r="5" fill="#ffd166" fill-opacity="0.52"/><text x="92" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">revenue maintains/operates.</tspan></text><path d="M396 372H420" stroke="#ffd166" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffd166" stroke-opacity=".26"/></g>
