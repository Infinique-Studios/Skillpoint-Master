      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">TLC and gas chromatography</tspan></text><circle cx="74" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="92" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Rf is condition-dependent.</tspan></text><circle cx="74" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Retention time alone needs</tspan><tspan x="92" dy="21">standards/library.</tspan></text><circle cx="74" cy="417" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="92" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Chromatography separates but does</tspan><tspan x="92" dy="21">not…</tspan></text><circle cx="74" cy="488" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="92" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">TLC stationary phase adsorbs</tspan><tspan x="92" dy="21">components…</tspan></text><path d="M396 372H420" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Carbon-13 NMR</tspan></text><circle cx="456" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="474" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Count environments, not atoms.</tspan></text><circle cx="456" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Carbonyl carbons appear far</tspan><tspan x="474" dy="21">downfield.</tspan></text><circle cx="456" cy="417" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="474" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Equivalent groups may collapse</tspan><tspan x="474" dy="21">signals.</tspan></text><circle cx="456" cy="488" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="474" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Each distinct carbon environment</tspan><tspan x="474" dy="21">gives…</tspan></text><path d="M778 372H802" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Proton NMR</tspan></text><circle cx="838" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="856" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Use adjacent-carbon proton count for</tspan><tspan x="856" dy="21">simple…</tspan></text><circle cx="838" cy="352" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="856" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">OH splitting is variable and may be</tspan><tspan x="856" dy="21">ignored.</tspan></text><circle cx="838" cy="423" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="856" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">TMS reference is 0 ppm; deuterated</tspan><tspan x="856" dy="21">solvent…</tspan></text><circle cx="838" cy="494" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="856" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Each proton environment gives a</tspan><tspan x="856" dy="21">signal.</tspan></text></svg>