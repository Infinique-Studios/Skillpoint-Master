<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Chemical Energetics — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Chemical Energetics</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffc857" stop-opacity=".18"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#ffc857"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#ffc857" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9701 · 23</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Chemical Energetics — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Lattice, hydration and</tspan><tspan x="222" dy="25">solution…</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Lattice energy is the enthalpy</tspan><tspan x="67" dy="20">change when gaseous ions form one</tspan><tspan x="67" dy="20">mole…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">the syllabus convention is</tspan><tspan x="67" dy="20">exothermic.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Born–Haber cycles combine</tspan><tspan x="67" dy="20">atomisation, ionisation energies,</tspan><tspan x="67" dy="20">electron…</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Hydration enthalpy is enthalpy</tspan><tspan x="67" dy="20">change when gaseous ions become</tspan><tspan x="67" dy="20">infinitely…</tspan></text><path d="M402 374H416" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Entropy</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Entropy measures dispersal of</tspan><tspan x="445" dy="20">energy/matter and number of</tspan><tspan x="445" dy="20">accessible…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Gases usually have greater entropy</tspan><tspan x="445" dy="20">than liquids and solids</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">more particles and more complex</tspan><tspan x="445" dy="20">molecules often increase entropy.</tspan></text><text x="445" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Standard entropy change is</tspan><tspan x="445" dy="20">ΣS°products − ΣS°reactants.</tspan></text><path d="M780 374H794" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Gibbs free energy</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">At constant temperature and</tspan><tspan x="823" dy="20">pressure, ΔG = ΔH − TΔS.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">A reaction is thermodynamically</tspan><tspan x="823" dy="20">feasible when ΔG 0.</tspan></text><text x="823" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Feasible does not mean fast.</tspan></text><text x="823" y="442" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">When ΔH and ΔS have opposite</tspan><tspan x="823" dy="20">signs, feasibility may depend on</tspan><tspan x="823" dy="20">temperature.</tspan></text></svg>