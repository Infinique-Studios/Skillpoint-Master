      <text x="83.5" y="168" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700">01</text>
      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Retrosynthetic planning</tspan></text><circle cx="74" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="92" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Write structures, not vague names.</tspan></text><circle cx="74" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Use one arrow per step with reagent</tspan><tspan x="92" dy="21">above…</tspan></text><circle cx="74" cy="417" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="92" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Track all carbons, including</tspan><tspan x="92" dy="21">nitrile/carbonyl…</tspan></text><circle cx="74" cy="488" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="92" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Mark the target functional group and</tspan><tspan x="92" dy="21">carbon…</tspan></text><path d="M396 372H420" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Functional-group map</tspan></text><circle cx="456" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="474" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Distillation stops primary oxidation</tspan><tspan x="474" dy="21">at…</tspan></text><circle cx="456" cy="352" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="474" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">LiAlH4/NaBH4 scope differs.</tspan></text><circle cx="456" cy="417" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="474" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Aqueous/ethanolic conditions change</tspan><tspan x="474" dy="21">substitution/elimination.</tspan></text><circle cx="456" cy="488" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="474" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Alkenes interconvert with</tspan><tspan x="474" dy="21">halogenoalkanes/alcohols</tspan></text><path d="M778 372H802" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".45"/>
