      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Practical efficiency and</tspan><tspan x="834" dy="28">identification</tspan></text><circle cx="838" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="856" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Overall yield is product of decimal</tspan><tspan x="856" dy="21">yields.</tspan></text><circle cx="838" cy="352" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="856" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">A shorter route is not always</tspan><tspan x="856" dy="21">safer/selective.</tspan></text><circle cx="838" cy="423" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="856" y="428" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">State observations for diagnostic</tspan><tspan x="856" dy="21">tests.</tspan></text><circle cx="838" cy="494" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="856" y="499" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Overall yield multiplies fractional</tspan><tspan x="856" dy="21">step…</tspan></text></svg>