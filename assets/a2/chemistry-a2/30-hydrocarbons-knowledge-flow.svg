<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#ffc857" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9701 · 30</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Hydrocarbons: Arenes — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Aromatic stability</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Six sp2 carbon atoms form a planar</tspan><tspan x="67" dy="20">σ ring</tspan></text><text x="67" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">one electron from each p orbital</tspan><tspan x="67" dy="20">forms a delocalised π system above</tspan><tspan x="67" dy="20">and…</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">All C–C bonds are equal and</tspan><tspan x="67" dy="20">intermediate in length.</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Hydrogenation releases less energy</tspan><tspan x="67" dy="20">than three isolated C=C bonds</tspan><tspan x="67" dy="20">would,…</tspan></text><path d="M402 374H416" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Electrophilic substitution</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Nitration uses concentrated</tspan><tspan x="445" dy="20">HNO3/H2SO4 to generate NO2+.</tspan></text><text x="445" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">The ring attacks electrophile,</tspan><tspan x="445" dy="20">forming a positively charged</tspan><tspan x="445" dy="20">intermediate</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">loss of H+ restores delocalisation</tspan><tspan x="445" dy="20">and regenerates catalyst.</tspan></text><text x="445" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Halogenation uses Br2/FeBr3 or</tspan><tspan x="445" dy="20">Cl2/AlCl3.</tspan></text><path d="M780 374H794" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Side-chain chemistry and</tspan><tspan x="978" dy="25">synthesis</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Alkylbenzene side chains can</tspan><tspan x="823" dy="20">undergo free-radical substitution</tspan><tspan x="823" dy="20">under…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Ring substituents affect electron</tspan><tspan x="823" dy="20">density and directing behaviour</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">synthetic routes must account for</tspan><tspan x="823" dy="20">activation and incompatible</tspan><tspan x="823" dy="20">reagents.</tspan></text><text x="823" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Friedel–Crafts alkylation may</tspan><tspan x="823" dy="20">rearrange/polyalkylate</tspan></text></svg>