<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Hydrocarbons: Arenes — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Hydrocarbons: Arenes</desc>
