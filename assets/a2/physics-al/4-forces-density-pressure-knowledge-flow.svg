<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Forces, Density and Pressure — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Forces, Density and Pressure</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d8ff" stop-opacity=".18"/><stop offset="1" stop-color="#55d8ff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#55d8ff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#55d8ff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#55d8ff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9702 · 4</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Forces, Density and Pressure — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Equilibrium and moments</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">A body in equilibrium has zero</tspan><tspan x="67" dy="20">resultant force and zero resultant</tspan><tspan x="67" dy="20">moment.</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Moment=force×perpendicular</tspan><tspan x="67" dy="20">distance.</tspan></text><text x="67" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">A couple is equal opposite</tspan><tspan x="67" dy="20">parallel forces with moment</tspan><tspan x="67" dy="20">F×separation…</tspan></text><text x="67" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Centre of gravity is effective</tspan><tspan x="67" dy="20">weight point</tspan></text><path d="M402 374H416" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Density and pressure</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Pressure is normal force per area</tspan></text><text x="445" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">in a fluid p=ρgh (gauge) and</tspan><tspan x="445" dy="20">depends on depth/density, not</tspan><tspan x="445" dy="20">container…</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Absolute pressure adds</tspan><tspan x="445" dy="20">atmospheric.</tspan></text><path d="M780 374H794" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#55d8ff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#55d8ff" fill-opacity=".13" stroke="#55d8ff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#55d8ff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Upthrust</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Pressure difference gives upward</tspan><tspan x="823" dy="20">force equal to weight of displaced</tspan><tspan x="823" dy="20">fluid…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Floating equilibrium:</tspan><tspan x="823" dy="20">upthrust=weight, displaced volume</tspan><tspan x="823" dy="20">adjusts.</tspan></text><text x="823" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Sinking/rising depends on mean</tspan><tspan x="823" dy="20">density and drag.</tspan></text></svg>