      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Diffraction and grating</tspan></text><circle cx="456" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="474" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">d=1/line density</tspan></text><circle cx="456" cy="346" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">n limited by sinθ≤1</tspan></text><circle cx="456" cy="411" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Diffraction is spreading at</tspan><tspan x="474" dy="21">aperture/edge,…</tspan></text><circle cx="456" cy="482" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Grating principal maxima satisfy d</tspan><tspan x="474" dy="21">sinθ=nλ</tspan></text><path d="M778 372H802" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
