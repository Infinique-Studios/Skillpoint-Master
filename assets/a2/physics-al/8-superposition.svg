      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Interference</tspan></text><circle cx="74" cy="281" r="5" fill="#55d8ff" fill-opacity="1"/><text x="92" y="286" fill="#55d8ff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">intensities do not simply add for</tspan><tspan x="92" dy="21">coherent…</tspan></text><circle cx="74" cy="352" r="5" fill="#55d8ff" fill-opacity="0.84"/><text x="92" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">phase/path link</tspan></text><circle cx="74" cy="417" r="5" fill="#55d8ff" fill-opacity="0.6799999999999999"/><text x="92" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Resultant displacement is algebraic</tspan><tspan x="92" dy="21">sum.</tspan></text><circle cx="74" cy="488" r="5" fill="#55d8ff" fill-opacity="0.52"/><text x="92" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Coherent sources maintain constant</tspan><tspan x="92" dy="21">phase…</tspan></text><path d="M396 372H420" stroke="#55d8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#55d8ff" stroke-opacity=".26"/></g>
