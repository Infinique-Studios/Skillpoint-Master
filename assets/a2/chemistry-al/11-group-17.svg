      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Physical and redox trends</tspan></text><circle cx="74" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="92" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">separate atom electron gain from X–X</tspan><tspan x="92" dy="21">bond…</tspan></text><circle cx="74" cy="352" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="92" y="357" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">state colours/states</tspan></text><circle cx="74" cy="417" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="92" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Halogens are diatomic</tspan></text><circle cx="74" cy="482" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="92" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">colour deepens and melting/boiling</tspan><tspan x="92" dy="21">rise…</tspan></text><path d="M396 372H420" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
