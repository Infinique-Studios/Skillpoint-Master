      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Displacement and halide</tspan><tspan x="452" dy="28">test</tspan></text><circle cx="456" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="474" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">use nitric acid, not HCl</tspan></text><circle cx="456" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">write ionic Ag++X−→AgX</tspan></text><circle cx="456" cy="411" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">A more powerful halogen oxidises a</tspan><tspan x="474" dy="21">lower…</tspan></text><circle cx="456" cy="482" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">In organic solvent the halogen</tspan><tspan x="474" dy="21">colour…</tspan></text><path d="M778 372H802" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
