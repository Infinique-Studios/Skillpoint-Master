      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Enthalpy definitions</tspan></text><circle cx="74" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="92" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">draw labelled energy profile</tspan></text><circle cx="74" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">include state symbols in definitions</tspan></text><circle cx="74" cy="411" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="92" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Exothermic reactions have negative</tspan><tspan x="92" dy="21">ΔH</tspan></text><circle cx="74" cy="482" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="92" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">endothermic positive.</tspan></text><path d="M396 372H420" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Calorimetry</tspan></text><circle cx="456" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="474" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">density may convert volume to mass</tspan></text><circle cx="456" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">divide q by moles reacted</tspan></text><circle cx="456" cy="411" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Heat measured q=mcΔT is related to</tspan><tspan x="474" dy="21">reaction…</tspan></text><circle cx="456" cy="482" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">surroundings gain is reaction loss,</tspan><tspan x="474" dy="21">so…</tspan></text><path d="M778 372H802" stroke="#ffc857" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#ffc857" fill-opacity=".12" stroke="#ffc857" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Hess and bond energies</tspan></text><circle cx="838" cy="281" r="5" fill="#ffc857" fill-opacity="1"/><text x="856" y="286" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">count every bond</tspan></text><circle cx="838" cy="346" r="5" fill="#ffc857" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">formation cycles use elements in</tspan><tspan x="856" dy="21">standard…</tspan></text><circle cx="838" cy="417" r="5" fill="#ffc857" fill-opacity="0.6799999999999999"/><text x="856" y="422" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Because enthalpy is a state</tspan><tspan x="856" dy="21">function,…</tspan></text><circle cx="838" cy="488" r="5" fill="#ffc857" fill-opacity="0.52"/><text x="856" y="493" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Reverse an equation reverses ΔH</tspan></text></svg>