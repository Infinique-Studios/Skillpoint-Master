<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Electrochemistry and Redox — recall map</title><desc id="description">Definition, rule and outcome recall map for Electrochemistry and Redox</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffc857" stop-opacity=".18"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#ffc857"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#ffc857" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">RECALL MAP · 9701 · 6</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Electrochemistry and Redox — recall map</tspan></text>
<g filter="url(#shadow)"><rect x="42" y="126" width="548" height="410" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".24"/><rect x="610" y="126" width="548" height="410" rx="25" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
    <text x="70" y="168" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Exact language</text>
    <text x="638" y="168" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Rules, formulae &amp; frameworks</text>
    <circle cx="75" cy="200" r="5" fill="#ffc857" fill-opacity="1"/>
        <text x="93" y="205" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="93" dy="0">Oxidation</tspan></text>
        <text x="93" y="230" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Loss of electrons or increase in oxidation number.</tspan></text><circle cx="75" cy="271" r="5" fill="#ffc857" fill-opacity="0.88"/>
        <text x="93" y="276" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="93" dy="0">Reduction</tspan></text>
        <text x="93" y="301" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Gain of electrons or decrease in oxidation number.</tspan></text><circle cx="75" cy="342" r="5" fill="#ffc857" fill-opacity="0.76"/>
        <text x="93" y="347" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="93" dy="0">Electrolysis</tspan></text>
        <text x="93" y="372" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Decomposition using electrical energy through an</tspan><tspan x="93" dy="18">electrolyte.</tspan></text>
    <circle cx="655" cy="200" r="5" fill="#ffc857" fill-opacity="1"/>
        <text x="673" y="205" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">sum oxidation numbers = species charge</tspan></text>
        <text x="673" y="230" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Oxidation-state rule — Include coefficients only</tspan><tspan x="673" dy="18">after…</tspan></text><circle cx="655" cy="289" r="5" fill="#ffc857" fill-opacity="0.88"/>
        <text x="673" y="294" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">electrons lost = electrons gained</tspan></text>
        <text x="673" y="319" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="673" dy="0">Redox balance — Overall reaction</tspan></text>
    <rect x="42" y="556" width="1116" height="80" rx="20" fill="#ffc857" fill-opacity=".07" stroke="#ffc857" stroke-opacity=".22"/>
    <text x="68" y="584" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700" letter-spacing="1.7">RECALL ROUTE</text>
    <text x="68" y="610" text-anchor="start" fill="#d9e8e0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400"><tspan x="68" dy="0">Assign oxidation numbers. • Identify oxidising/reducing agents. • Balance redox half-equations.</tspan></text></svg>