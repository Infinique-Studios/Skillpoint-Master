<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Halogen Compounds — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Halogen Compounds</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffc857" stop-opacity=".18"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#ffc857"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#ffc857" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9701 · 15</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Halogen Compounds — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Bond and hydrolysis</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Cδ+–Xδ− makes carbon</tspan><tspan x="67" dy="20">electrophilic.</tspan></text><text x="67" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Warm aqueous OH− substitutes X to</tspan><tspan x="67" dy="20">alcohol.</tspan></text><text x="67" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Rate generally RI&gt;RBr&gt;RCl because</tspan><tspan x="67" dy="20">C–X bond strength decreases down</tspan><tspan x="67" dy="20">group.</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">After hydrolysis, acidified AgNO3</tspan><tspan x="67" dy="20">gives characteristic precipitates.</tspan></text><path d="M402 374H416" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Nucleophilic substitution</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">OH− gives alcohol</tspan></text><text x="445" y="302" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">CN− in ethanol gives nitrile and</tspan><tspan x="445" dy="20">extends chain by one carbon</tspan></text><text x="445" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">excess ethanolic NH3 gives primary</tspan><tspan x="445" dy="20">amine.</tspan></text><text x="445" y="442" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Curly arrow starts at nucleophile</tspan><tspan x="445" dy="20">lone pair toward carbon and C–X</tspan><tspan x="445" dy="20">pair…</tspan></text><path d="M780 374H794" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Elimination and environment</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Hot ethanolic hydroxide acts as</tspan><tspan x="823" dy="20">base, removing β-H while halide</tspan><tspan x="823" dy="20">leaves…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Competing routes depend on</tspan><tspan x="823" dy="20">solvent, temperature and</tspan><tspan x="823" dy="20">substrate.</tspan></text><text x="823" y="432" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">CFC radicals catalyse ozone</tspan><tspan x="823" dy="20">destruction</tspan></text><text x="823" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">alternatives reduce chlorine</tspan><tspan x="823" dy="20">release but may have greenhouse</tspan><tspan x="823" dy="20">impacts.</tspan></text></svg>