      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Atomic trends</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Across Period 3 nuclear charge</tspan><tspan x="67" dy="20">increases while shielding is</tspan><tspan x="67" dy="20">similar,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Ions show jumps between cations</tspan><tspan x="67" dy="20">and anions and decreasing radii</tspan><tspan x="67" dy="20">within…</tspan></text><path d="M402 374H416" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Physical structure</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Na–Al are metallic with stronger</tspan><tspan x="445" dy="20">bonding as charge/electron density</tspan><tspan x="445" dy="20">rises</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Si is giant covalent with very</tspan><tspan x="445" dy="20">high melting</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">P4, S8, Cl2, Ar are simple</tspan><tspan x="445" dy="20">molecular/atomic with London</tspan><tspan x="445" dy="20">forces…</tspan></text><text x="445" y="502" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Conductivity needs delocalised</tspan><tspan x="445" dy="20">electrons.</tspan></text><path d="M780 374H794" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Chemical periodicity</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Oxides change basic → amphoteric →</tspan><tspan x="823" dy="20">acidic.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Chlorides range ionic to covalent</tspan><tspan x="823" dy="20">and hydrolyse differently</tspan></text><text x="823" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">covalent chlorides can form acidic</tspan><tspan x="823" dy="20">fumes/solutions.</tspan></text><text x="823" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Reactions with water, acids and</tspan><tspan x="823" dy="20">bases reveal bonding and acid–base</tspan><tspan x="823" dy="20">character.</tspan></text></svg>