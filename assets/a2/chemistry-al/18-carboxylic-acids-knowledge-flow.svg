<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Carboxylic Acids and Derivatives — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Carboxylic Acids and Derivatives</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffc857" stop-opacity=".18"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#ffc857"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#ffc857" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#ffc857" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9701 · 18</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Carboxylic Acids and Derivatives — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Formation and acidity</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Primary alcohols/aldehydes oxidise</tspan><tspan x="67" dy="20">to acids</tspan></text><text x="67" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">nitriles hydrolyse under</tspan><tspan x="67" dy="20">acid/alkali.</tspan></text><text x="67" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Carboxylic acids donate H+ because</tspan><tspan x="67" dy="20">carboxylate is</tspan><tspan x="67" dy="20">resonance-stabilised,…</tspan></text><text x="67" y="482" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">They react with metals, bases and</tspan><tspan x="67" dy="20">carbonates</tspan></text><path d="M402 374H416" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Esterification</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Acid + alcohol ⇌ ester + water</tspan><tspan x="445" dy="20">under concentrated H2SO4 and</tspan><tspan x="445" dy="20">reflux.</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Name alkyl from alcohol then</tspan><tspan x="445" dy="20">alkanoate from acid.</tspan></text><text x="445" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Equilibrium yield improves with</tspan><tspan x="445" dy="20">excess reagent/removal.</tspan></text><path d="M780 374H794" stroke="#ffc857" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ffc857" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ffc857" fill-opacity=".13" stroke="#ffc857" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ffc857" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Hydrolysis and fats</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Acidic ester hydrolysis is</tspan><tspan x="823" dy="20">reversible</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">alkaline produces carboxylate +</tspan><tspan x="823" dy="20">alcohol and is effectively</tspan><tspan x="823" dy="20">irreversible.</tspan></text><text x="823" y="412" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Triglycerides are triesters</tspan></text><text x="823" y="462" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">alkaline hydrolysis gives glycerol</tspan><tspan x="823" dy="20">and soap salts.</tspan></text></svg>