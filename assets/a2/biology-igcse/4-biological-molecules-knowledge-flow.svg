      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Water and diet</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Water is</tspan><tspan x="823" dy="20">solvent/transport/coolant/reactant.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Balanced diet includes</tspan><tspan x="823" dy="20">carbohydrate, lipid, protein,</tspan><tspan x="823" dy="20">vitamins,…</tspan></text></svg>