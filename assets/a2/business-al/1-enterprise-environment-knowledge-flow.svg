      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Entrepreneurship, business plans,</tspan><tspan x="67" dy="20">sectors and ownership: sole</tspan><tspan x="67" dy="20">trader,…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Evaluate control, liability,</tspan><tspan x="67" dy="20">continuity and finance.</tspan></text><path d="M402 374H416" stroke="#7ae7c7" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#7ae7c7" stroke-opacity=".22"/></g>
