      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">Development and inequality</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Modernisation,</tspan><tspan x="67" dy="20">dependency/world-systems,</tspan><tspan x="67" dy="20">state-centred…</tspan></text><text x="67" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">measures and colonial histories.</tspan></text><text x="67" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Aid, debt, trade and TNCs.</tspan></text><path d="M402 374H416" stroke="#ff9fcb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Global processes</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Economic/political/cultural</tspan><tspan x="445" dy="20">globalisation, transnational</tspan><tspan x="445" dy="20">organisations,…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">homogenisation, hybridisation and</tspan><tspan x="445" dy="20">resistance.</tspan></text><path d="M780 374H794" stroke="#ff9fcb" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#ff9fcb" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#ff9fcb" fill-opacity=".13" stroke="#ff9fcb" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#ff9fcb" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Migration and demography</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Push/pull, labour migration,</tspan><tspan x="823" dy="20">refugees, remittances, brain</tspan><tspan x="823" dy="20">drain/gain,…</tspan></text><text x="823" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Citizenship/borders and unequal</tspan><tspan x="823" dy="20">ecological impacts.</tspan></text></svg>