      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">Applications</tspan></text><circle cx="838" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="856" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">include units</tspan></text><circle cx="838" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">justify maximum/minimum</tspan></text><circle cx="838" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Model quantity, differentiate, solve</tspan><tspan x="856" dy="21">feasible…</tspan></text><circle cx="838" cy="482" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="856" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Related rates may use chain rule</tspan><tspan x="856" dy="21">dy/dt=(dy/dx)(dx/dt)…</tspan></text></svg>