      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Tangent and stationary</tspan><tspan x="452" dy="28">points</tspan></text><circle cx="456" cy="281" r="5" fill="#c89bff" fill-opacity="1"/><text x="474" y="286" fill="#c89bff" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">state coordinates and nature</tspan></text><circle cx="456" cy="346" r="5" fill="#c89bff" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">horizontal normal vertical</tspan></text><circle cx="456" cy="411" r="5" fill="#c89bff" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">At x=a gradient f′(a)</tspan></text><circle cx="456" cy="476" r="5" fill="#c89bff" fill-opacity="0.52"/><text x="474" y="481" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">tangent y−f(a)=m(x−a), normal</tspan><tspan x="474" dy="21">gradient−1/m.</tspan></text><path d="M778 372H802" stroke="#c89bff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#c89bff" stroke-opacity=".26"/></g>
