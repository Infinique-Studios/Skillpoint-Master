        <text x="93" y="319" text-anchor="start" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400"><tspan x="93" dy="0">Different inputs give different outputs.</tspan></text><circle cx="75" cy="360" r="5" fill="#c89bff" fill-opacity="0.76"/>
