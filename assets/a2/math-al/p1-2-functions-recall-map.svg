    <circle cx="655" cy="200" r="5" fill="#ffc857" fill-opacity="1"/>
        <text x="673" y="205" text-anchor="start" fill="#ffc857" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700"><tspan x="673" dy="0">(f∘g)(x)=f(g(x))</tspan></text>
