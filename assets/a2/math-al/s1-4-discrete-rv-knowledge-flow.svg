<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">Discrete Random Variables — knowledge flow</title><desc id="description">Step-by-step knowledge sequence for Discrete Random Variables</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1511"/><stop offset="1" stop-color="#09100d"/></linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c89bff" stop-opacity=".18"/><stop offset="1" stop-color="#c89bff" stop-opacity="0"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#c89bff"/></marker>
</defs>
<rect width="1200" height="675" rx="32" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="673" rx="31" fill="none" stroke="#c89bff" stroke-opacity=".13"/>
<path d="M0 0H760L570 170H0Z" fill="url(#glow)"/>
<text x="52" y="43" fill="#c89bff" font-family="'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2.6">KNOWLEDGE FLOW · 9709 · S1.4</text>
<text x="52" y="80" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700"><tspan x="52" dy="0">Discrete Random Variables — knowledge flow</tspan></text>
<g filter="url(#shadow)"><rect x="45" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="222" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="222" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">1</text>
      <text x="222" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="222" dy="0">General distributions</tspan></text>
      <text x="67" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Probabilities nonnegative and</tspan><tspan x="67" dy="20">sum1.</tspan></text><text x="67" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Var=E(X²)−E(X)².</tspan></text><text x="67" y="372" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="67" dy="0">Linear transformations change</tspan><tspan x="67" dy="20">mean/variance predictably at AS</tspan><tspan x="67" dy="20">level…</tspan></text><path d="M402 374H416" stroke="#c89bff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="423" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="600" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="600" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">2</text>
      <text x="600" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="600" dy="0">Binomial</tspan></text>
      <text x="445" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">X~B(n,p) for fixed n independent</tspan><tspan x="445" dy="20">identical Bernoulli trials with</tspan><tspan x="445" dy="20">constant…</tspan></text><text x="445" y="342" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">P(X=r)=nCr p^r(1−p)^{n−r}</tspan></text><text x="445" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">mean np, variance npq.</tspan></text><text x="445" y="442" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="445" dy="0">Use cumulative/complement wording</tspan><tspan x="445" dy="20">carefully.</tspan></text><path d="M780 374H794" stroke="#c89bff" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="801" y="138" width="354" height="470" rx="24" fill="#111d18" stroke="#c89bff" stroke-opacity=".22"/></g>
      <circle cx="978" cy="169" r="18" fill="#c89bff" fill-opacity=".13" stroke="#c89bff" stroke-opacity=".55"/>
      <text x="978" y="174" text-anchor="middle" fill="#c89bff" font-family="'Courier New',monospace" font-size="11" font-weight="700">3</text>
      <text x="978" y="211" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700"><tspan x="978" dy="0">Geometric</tspan></text>
      <text x="823" y="252" fill="#e8f4ee" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">X trial number of first success:</tspan><tspan x="823" dy="20">P(X=r)=q^{r−1}p, mean1/p.</tspan></text><text x="823" y="322" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">Memoryless under independent</tspan><tspan x="823" dy="20">constant p.</tspan></text><text x="823" y="392" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="823" dy="0">“More than n trials”=q^n.</tspan></text></svg>