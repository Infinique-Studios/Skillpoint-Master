      <text x="83.5" y="168" text-anchor="middle" fill="#ffd166" font-family="'Courier New',monospace" font-size="12" font-weight="700">01</text>
      <text x="70" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="70" dy="0">Cycle and double entry</tspan></text><circle cx="74" cy="281" r="5" fill="#ffd166" fill-opacity="1"/><text x="92" y="286" fill="#ffd166" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">control/audit trail</tspan></text><circle cx="74" cy="346" r="5" fill="#ffd166" fill-opacity="0.84"/><text x="92" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">computerised posting</tspan></text><circle cx="74" cy="411" r="5" fill="#ffd166" fill-opacity="0.6799999999999999"/><text x="92" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Documents→prime entry→ledgers→trial</tspan><tspan x="92" dy="21">balance→adjustments→statements.</tspan></text><circle cx="74" cy="482" r="5" fill="#ffd166" fill-opacity="0.52"/><text x="92" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="92" dy="0">Debit/credit by account type</tspan></text><path d="M396 372H420" stroke="#ffd166" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="424" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffd166" stroke-opacity=".26"/></g>
      <rect x="446" y="143" width="39" height="39" rx="12" fill="#ffd166" fill-opacity=".12" stroke="#ffd166" stroke-opacity=".45"/>
      <text x="465.5" y="168" text-anchor="middle" fill="#ffd166" font-family="'Courier New',monospace" font-size="12" font-weight="700">02</text>
      <text x="452" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="452" dy="0">Errors and suspense</tspan></text><circle cx="456" cy="281" r="5" fill="#ffd166" fill-opacity="1"/><text x="474" y="286" fill="#ffd166" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">one/two-sided</tspan></text><circle cx="456" cy="346" r="5" fill="#ffd166" fill-opacity="0.84"/><text x="474" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">retrospective correction</tspan></text><circle cx="456" cy="411" r="5" fill="#ffd166" fill-opacity="0.6799999999999999"/><text x="474" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">Error types, correction journals,</tspan><tspan x="474" dy="21">suspense…</tspan></text><circle cx="456" cy="482" r="5" fill="#ffd166" fill-opacity="0.52"/><text x="474" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="474" dy="0">trial-balance limitations.</tspan></text><path d="M778 372H802" stroke="#ffd166" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="806" y="125" width="352" height="490" rx="25" fill="#111d18" stroke="#ffd166" stroke-opacity=".26"/></g>
      <rect x="828" y="143" width="39" height="39" rx="12" fill="#ffd166" fill-opacity=".12" stroke="#ffd166" stroke-opacity=".45"/>
      <text x="847.5" y="168" text-anchor="middle" fill="#ffd166" font-family="'Courier New',monospace" font-size="12" font-weight="700">03</text>
      <text x="834" y="214" text-anchor="start" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="834" dy="0">System evaluation</tspan></text><circle cx="838" cy="281" r="5" fill="#ffd166" fill-opacity="1"/><text x="856" y="286" fill="#ffd166" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">data integrity</tspan></text><circle cx="838" cy="346" r="5" fill="#ffd166" fill-opacity="0.84"/><text x="856" y="351" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">fraud</tspan></text><circle cx="838" cy="411" r="5" fill="#ffd166" fill-opacity="0.6799999999999999"/><text x="856" y="416" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">Internal controls, segregation,</tspan><tspan x="856" dy="21">authorisation,…</tspan></text><circle cx="838" cy="482" r="5" fill="#ffd166" fill-opacity="0.52"/><text x="856" y="487" fill="#9bb0a6" font-family="Inter,Arial,sans-serif" font-size="15"><tspan x="856" dy="0">manual vs computerised</tspan><tspan x="856" dy="21">benefits/risks.</tspan></text></svg>